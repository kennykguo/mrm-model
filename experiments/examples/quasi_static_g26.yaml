# Example (kind quasi_static, 07 P0-10, BND-4): the locked steady state of every g26 ring over ambient 0-105 degC
# and bias 1.0-3.75 V (no time stepping): code-range coverage, FSR-hop and wrong-line risk, the oracle relOMA map.
extends: g26
meta: {name: quasi_static_g26, kind: experiment}
experiment:
  kind: quasi_static
  uncertainty: nominal
  variation: "off"
  grid:
    ambient_c: [0.0, 15.0, 25.0, 35.0, 45.0, 55.0, 65.0, 75.0, 85.0, 95.0, 105.0]
    bias_v: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 3.75]
