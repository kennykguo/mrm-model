# Example (kind mc): 64 sampled worlds of the g26 uncertainty set with per-device variation, pi_lock_c from a
# settled warm start, 20 ms of steady lock, metrics only. Rings whose locked-steady-state lock code is out of
# heater range start at code_min (world summary warm_start_no_code_rings counts them).
#   mrm mc experiments/examples/mc_pi_lock.yaml --set experiment.n_mc=256
extends: g26
meta: {name: mc_pi_lock, kind: experiment}
controller: {name: pi_lock_c}
scenario: {name: static}
experiment:
  kind: mc
  duration_s: 0.02
  n_mc: 64
  seeds: {device: 1000, uncertainty: 2000, noise: 3000, scenario: 4000}
  uncertainty: sample
  variation: sample
  start: warm
  score_from_s: 0.005
  self_reference: {duration_s: 0.02, window_s: 0.005}
