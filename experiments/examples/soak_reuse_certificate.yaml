# Example (kind run): the 30.4 h soak at time compression 100 reusing the convergence certificate of an earlier
# run of experiments/acceptance/a4_soak.yaml: set experiment.convergence_certificate to that run
# directory, e.g.  mrm run experiments/examples/soak_reuse_certificate.yaml \
#                    --set experiment.convergence_certificate=runs/<UTC>_<hash8>
# The certificate holds only for the same plant, controller, start, scenario and worlds (the acceptance main case is
# the nominal world with variation off, seeds 0; mrm.sim.experiment.plant_fingerprint), not for another duration,
# and only for the code and numerics that made it (mrm.sim.manifest.code_fingerprint): after an edit of the engine,
# the controllers, mrm.params or mrm/data, or another numba / numpy, the convergence experiment must run again. The
# A4 certificate of 2026-10-10 (runs/acceptance_20261010/20261010T115721Z_d1511028) no longer covers the tree: it
# records no code fingerprint, and the g26 plant changed on 2026-10-16.
extends: ../acceptance/a4_soak.yaml
meta: {name: soak_reuse_certificate, kind: experiment}
experiment:
  kind: run
  uncertainty: nominal
  variation: "off"
