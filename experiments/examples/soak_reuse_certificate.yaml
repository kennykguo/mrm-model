# Example (kind run): the 30.4 h soak at time compression 100 reusing the convergence certificate of an earlier
# run of experiments/acceptance/a4_soak.yaml (07 P0-10): set experiment.convergence_certificate to that run
# directory, e.g.  mrm run experiments/examples/soak_reuse_certificate.yaml \
#                    --set experiment.convergence_certificate=runs/<UTC>_<hash8>
# The certificate holds only for the same plant, controller, start, scenario and worlds (the acceptance main case is
# the nominal world with variation off, seeds 0; mrm.sim.experiment.plant_fingerprint), not for another duration.
extends: ../acceptance/a4_soak.yaml
meta: {name: soak_reuse_certificate, kind: experiment}
experiment:
  kind: run
  uncertainty: nominal
  variation: "off"
