# Example (kind compare): four lock controllers under A1 on the nominal world, the 12 named corners and 256
# Latin-hypercube worlds (metrics only); reports the nominal result, the worst named corner, quantiles over the
# worlds and the Kendall-tau stability of the ranking. The model-based controllers need the model_nominal token.
#   mrm compare experiments/examples/compare_locks.yaml --dry-run
extends: g26
meta: {name: compare_locks, kind: experiment}
controller_interface:
  knowledge: [line_grid, ring_to_line, model_nominal]
scenario: {name: a1, params: {phase_s: 0.06535}}
metrics: {lock_threshold_pm: 5.0, hysteresis_pm: 1.0}
experiment:
  kind: compare
  duration_s: 0.1357
  n_mc: 256
  seeds: {device: 100, uncertainty: 200, noise: 300, scenario: 400}
  uncertainty: lhs
  variation: "off"            # epistemic worlds only: device variation would add warm-start failures
  start: warm
  score_from_s: 0.005
  self_reference: {duration_s: 0.02, window_s: 0.005}
  controllers:
    - pi_lock_c
    - {name: pi_lock_c, label: pi_lock_c_type2, params: {k2: 0.005}}   # type 2 (controllers_a handoff)
    - kalman_lqg_c
    - mpc_c
