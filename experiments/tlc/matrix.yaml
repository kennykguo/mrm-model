# TLC scenario matrix (docs/TLC_PORT_SPEC_AND_PLAN.md 3): every experiment runs with every controller.
# tools/tlc_matrix.py runs it and writes docs/tlc/results.md. Each experiment file names the TLC as its own
# controller; the matrix overrides controller.name and controller.params per run. An entry {path, controllers}
# runs only the named controllers, with the experiment's own params for the TLC. A controller marked
# restricted_only runs only where an entry names it.
experiments:
  - experiments/tlc/steady_tlc_faithful.yaml      # R1 steady state
  - experiments/tlc/xpu_step_tlc.yaml             # R2 die-temperature ramp (D1)
  - experiments/tlc/a1_tlc.yaml                   # R3 / R6 local aggressor (D2 local)
  - experiments/tlc/laser_drift_tlc.yaml          # R5 laser wavelength drift (D4)
  - experiments/tlc/power_step_tlc.yaml           # R7 laser power step (D5)
  - experiments/tlc/squelch_tlc.yaml              # R12 squelch (D6)
  - {path: experiments/tlc/fallback_tlc.yaml, controllers: [tlc]}   # R22 forced PI fallback
  - {path: experiments/tlc/cold_tlc.yaml, controllers: [tlc]}       # R8 cold start (TLC ACQUIRE)
  - {path: experiments/tlc/cold_wdm.yaml, controllers: [wdm_supervisor]}   # R8 comparator
  - {path: experiments/tlc/cold_campaign_tlc.yaml, controllers: [tlc]}            # R9 cold-start campaign
  - {path: experiments/tlc/cold_campaign_wdm.yaml, controllers: [wdm_supervisor]} # R9 comparator
  # extensions (spec 6, Q9): ECE496 disturbances G26 lacks, labelled as such
  - experiments/tlc/ext_common_aggressor_tlc.yaml # R3 / R4 common-mode aggressor (die-wide signal)
  - experiments/tlc/ext_kick_tlc.yaml             # R10 +10 K kick (die-wide, not local)
  - {path: experiments/tlc/ext_pd_fault_tlc.yaml, controllers: [tlc]}   # R21 PD missing (adapter boundary)
controllers:                                      # spec 6, Q2
  - {name: tlc, params: {core: faithful}}
  - {name: tlc_pi, params: {}}
  - {name: pi_lock_c, params: {}}
  - {name: dither_lockin_c, params: {}}
  - {name: kalman_lqg_c, params: {}}
  - {name: mpc_c, params: {}}
  - {name: wdm_supervisor, params: {}, restricted_only: true}   # cold start only

corners:                                          # spec 6, Q7: model trust (plant and priors follow the corner)
  presets: [g26_fast_thermal, g26_slow_thermal, g26_textbook_thermal, g26_tec_package]   # tec_package: crosstalk
  experiments:
    - experiments/tlc/steady_tlc_faithful.yaml
    - experiments/tlc/a1_tlc.yaml
  controllers: [tlc, pi_lock_c]
