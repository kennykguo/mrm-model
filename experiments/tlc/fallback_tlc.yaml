# TLC scenario matrix, ECE496 forced PI fallback (R22): the faithful TLC on the static scenario, its supervisor
# forced into FAULT (PI fallback, bumpless transfer) at 30 ms. TLC only (the other controllers have no fallback).
extends: g26
meta: {name: tlc_fallback, kind: experiment, description: "forced PI fallback at 30 ms; TLC only"}
controller_interface:
  knowledge: [line_grid, ring_to_line, model_nominal]
controller: {name: tlc, params: {core: faithful, force_fault_at_s: 0.03}}
scenario: {name: static}
metrics: {lock_threshold_pm: 5.0, hysteresis_pm: 1.0}
experiment:
  kind: run
  duration_s: 0.08
  batch: 1
  seeds: {device: 0, uncertainty: 0, noise: 0, scenario: 0}
  uncertainty: nominal
  variation: "off"
  start: warm
  score_from_s: 0.005
  self_reference: {duration_s: 0.02, window_s: 0.005}
