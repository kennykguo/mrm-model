# TLC scenario matrix, EXTENSION (spec 6, Q9): ECE496 D2 common-mode aggressor (R3, R4), which G26's site-based
# aggressors do not reproduce. Mapped onto mrm's die-wide XPU signal (thermal.xpu_rise_k, every ring alike): one
# raised-cosine edge of +3 K at the source's 2200 K/s peak rate (rise 2.14 ms) at 10 ms, back down at 75 ms. The
# source's waveform has a 3 K swing per 130 ms period at the rings; here one period. No plant change.
extends: g26
meta: {name: tlc_ext_common_aggressor, kind: experiment, description: "EXTENSION common-mode 3 K edge at 2200 K/s"}
controller_interface:
  knowledge: [line_grid, ring_to_line, model_nominal]
controller: {name: tlc, params: {core: faithful}}
scenario: {name: xpu_power_step, params: {rate_k_per_s: 2200.0, t_peak_rate_s: 0.0010710, delta_k: 3.0, t0_s: 0.01,
                                          t_down_s: 0.075}}
metrics: {lock_threshold_pm: 5.0, hysteresis_pm: 1.0}
experiment:
  kind: run
  duration_s: 0.14
  batch: 1
  seeds: {device: 0, uncertainty: 0, noise: 0, scenario: 0}
  uncertainty: nominal
  variation: "off"
  start: warm
  score_from_s: 0.005
  self_reference: {duration_s: 0.02, window_s: 0.005}
