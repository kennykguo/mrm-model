# TLC scenario matrix, ECE496 D5 laser power step (R7, +/-3 dB) -> mrm fibre-loss step of +3 dB at 10 ms (less
# power into every ring). Run every controller of the matrix with tools/tlc_matrix.py.
extends: g26
meta: {name: tlc_power_step, kind: experiment, description: "fibre loss +3 dB at 10 ms; TLC matrix"}
controller_interface:
  knowledge: [line_grid, ring_to_line, model_nominal]
controller: {name: tlc, params: {core: faithful}}
scenario: {name: fibre_loss_step, params: {t_s: 0.01, delta_db: 3.0}}
metrics: {lock_threshold_pm: 5.0, hysteresis_pm: 1.0}
experiment:
  kind: run
  duration_s: 0.06
  batch: 1
  seeds: {device: 0, uncertainty: 0, noise: 0, scenario: 0}
  uncertainty: nominal
  variation: "off"
  start: warm
  score_from_s: 0.005
  self_reference: {duration_s: 0.02, window_s: 0.005}
