# Acceptance B1 (textbook Ch17 group B, scenario b1): squelch (OCI via OCP: modulation cut to <= -15 dBm OMA with the
# average power kept, printed normative), here the junction swing to zero from 10 to 30 ms on every ring. The data
# heat (CV^2 and driver transitions, ~2 K) and the bit-averaged monitor level change, so a monitor lock moves.
# No traffic means no BER while squelched, so BER is not judged. Criteria: lock about the operating point, line, hop.
extends: g26
meta: {name: acc_b1_squelch, kind: experiment, description: "B1 squelch 10-30 ms, pi_lock_c"}
controller: {name: pi_lock_c}
scenario: {name: b1, params: {t_on_s: 0.01, t_off_s: 0.03}}
metrics: {lock_threshold_pm: 5.0, hysteresis_pm: 1.0}
experiment:
  kind: acceptance
  duration_s: 0.06
  seeds: {device: 0, uncertainty: 0, noise: 0, scenario: 0}
  start: warm
  score_from_s: 0.005
  self_reference: {duration_s: 0.02, window_s: 0.005}
  acceptance:
    - {id: B1-lock, metric: max_abs_lock_error_pm, op: "<=", value: 5.0, source: "04 section 4 (5 pm lock budget)"}
    - {id: B1-line, metric: wrong_line_rings, op: "==", value: 0, source: "07 P1-12"}
    - {id: B1-hop, metric: fsr_hop_events, reduce: sum, op: "==", value: 0, source: "BND-2"}
