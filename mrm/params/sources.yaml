  # ------------------------------------------------------------------------------------------------- extraction artefacts (mrm/data/extracted/)
  X-MODES: "mrm/data/extracted/modes_<xsec>.json (schema modes/1, mrm.extraction.modes): bent-mode n_eff, n_g, dlambda/dT(T), index weights, Jacobian, bend radiation. Geometry inputs are assumed (solver(assumed-geometry))."
  X-COUPLING: "mrm/data/extracted/coupling_<xsec>.json (schema coupling/1, mrm.extraction.coupling): K^2 per pass, dln K^2/dlambda, dln K^2/dgap of the through and drop couplers."
  X-THERMAL: "mrm/data/extracted/thermal_rom_<family>_<film>.npz + .json (schema thermal_rom/1, mrm.extraction.thermal_fem): FEM Foster ROM; summary z_ratio_opt_heater, rom_dc_scale table."
  X-JUNCTION: "mrm/data/extracted/junction_<xsec>.json (schema junction/1, mrm.extraction.junction): dneff(V), absolute alpha_FCA(V), C(V), r_s(V)."
  # ------------------------------------------------------------------------------------------------- textbook
  textbook-REF: "Kenny's textbook REF table, /Users/kenny/interactive-textbooks/lightmatter-capstone/src/physics/index.ts (HEAD 02c9c54), where no source tag is attached to the row; also its derived helpers (HEATER_OHM_COLD, heaterSelfHeatPerMw)."
  textbook: "Kenny's textbook chapters (lightmatter-capstone/src/chapters), e.g. Ch11 heater DAC full scale 1.6 V, Ch17 plant model."
  # ------------------------------------------------------------------------------------------------- this model
  MODEL: "A choice made for this model, with no external source (a simulation default, a convention, or a placeholder for an unpublished number). The leaf note says which, and its provenance is 'assumed'."
