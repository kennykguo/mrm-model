# over-coupled mirror of the 27.9 dB G25 notch at zero heater voltage.
# pin loaded Q to 3850 so the branch is exact. independently varying Q
# can move the ring across critical coupling.
extends: g26
meta:
  name: g26_overcoupled
  kind: corner
  description: "g26 with uncertainty.coupling_regime pinned to over and uncertainty.q_loaded to its nominal"
alts:
  uncertainty.coupling_regime: over
  uncertainty.q_loaded: nominal
