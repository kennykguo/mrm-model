# g26: the default preset. The G26 transmit MRM bank of Lightmatter's OFC 2026 M4B.3 link (Passage EVK50): 8
# add-drop depletion MRMs on one bus, a drop-port monitor PD per ring, an in-ring resistive heater, 8 lines on a
# 400 GHz grid, 50 Gb/s NRZ. Where G26 is silent the G25 test vehicle (OFC 2025 Tu3J.6, same GF 45SPCLO platform)
# supplies the device physics; meta.generation_mix says which block comes from where.
#
# Format: docs/PARAMETERS_FORMAT.md. Every physical number is a leaf {value, provenance, generation, source, ...}; a
# solver-derived leaf takes its value from an extraction artefact ({from: "extracted/<file>:<key>"}) and carries a
# 'fallback' alternative with a literature or inferred value (see docs/handoff/params_content.md: until an artefact
# exists the loader uses that fallback with a warning). Disputed values are alternatives on the leaf; epistemic
# unknowns are uncertainty entries (one draw per world, 07 4.8); per-device spread is variation (07 P1-16).
# Numbers and their reasoning: docs/research/01..06 (corrected notes win) and 07 (decisions D1-D22, 4.3, 4.8).
# Generated documentation: docs/PARAMETERS.md (mrm params table g26 --out docs/PARAMETERS.md).
meta:
  name: g26
  kind: preset
  description: >-
    G26 transmit MRM bank (OFC 2026 M4B.3, Passage EVK50): 8 add-drop depletion MRMs with in-ring heaters and drop-port
    monitors on one bus, 8 lines on a 400 GHz grid near 1310 nm, 50 Gb/s NRZ. Interim three-pole thermal model (07
    P1-2), analytic junction, self-heating on, epistemic worlds of 07 section 4.8.
  generation_mix: >-
    G26 (LM26-P, LM26-S, QDSOA): channel plan, laser power at the module, 8 rings per bus, drop-port monitor topology,
    16-bit heater DAC, bias axis 1.0-3.75 V, 50 Gb/s NRZ, 2 s BER interval, the ~15 GHz/degC aside (H86).
    G25 (LM-P, LM-T via the textbook): Q_L, notch depths, blue offset 7.6 nm, heater P_FSR/R/V, droop fit, junction
    efficiency ladder, responsivity, +4 dBm at the ring, 1.3 Vpp driver. GF 45SPCLO (GF-IMAPS, GF-BIAN, GF-ECIO): 160 nm
    film, 2 um BOX, passive loss, Ge PD dark current. Literature (imec CO22/CO24): thermal poles and crosstalk.
    Solver (mrm/data/extracted, assumed geometry): bent-mode indices, dlambda/dT(T), Jacobian, bend radiation, coupler
    dispersion. PAT-2: integrating ADC and DAC+PWM heater drive. Everything else is assumed and says so.
  inventory:
    # docs/research/00_prior_notes_checklist.md: every item is a key, excluded with a reason, or unknown.
    # status key: modelled through the listed keys (schema paths, uncertainty.<entry>, variation.<path>);
    # excluded: deliberately not modelled, with the reason; unknown: no public number, with what stands in for it.
    A:
      "ring radius / round-trip length": {status: key, keys: [ring.geometry.radius_um, ring.optics.fsr_thz], reason: "R3 derives the radius from the FSR hypothesis and n_g; L = 2 pi R"}
      "bus-ring gap": {status: key, keys: [ring.optics.kappa_d_over_kappa, ring.optics.q_through, variation.ring.optics.kappa_d_over_kappa, variation.ring.optics.q_loaded], reason: "gaps live in coupling_<xsec>.json; at runtime the couplers are Q_t (derived from Q_L) and kappa_d/kappa; the drop-gap spread is rel_sigma 0.1 on kappa_d/kappa and the through-gap spread rel_sigma 0.015 on Q_L (Q_t moves, Q_i stays)"}
      "coupling length and coupler geometry": {status: key, keys: [ring.optics.dln_kappa2_through_dlambda_per_nm, ring.optics.dln_kappa2_drop_dlambda_per_nm], reason: "curved-gap coupler solved in coupling_<xsec>.json (07 P1-5); its K^2 at the gap enters through Q_t/kappa_d, its dispersion through these keys"}
      "waveguide width, height, cross-section type (rib/strip/slab)": {status: key, keys: [ring.geometry.width_nm, ring.geometry.film_nm, ring.geometry.slab_nm, ring.geometry.xsec, uncertainty.film_thickness]}
      "bend geometry": {status: key, keys: [ring.geometry.radius_um, ring.optics.n_eff, ring.optics.loss_budget.alpha_bend_radiation_db_per_cm], reason: "bent-mode solve at r_ref (07 P1-6)"}
      "Si index vs wavelength": {status: key, keys: [ring.optics.n_g, ring.optics.dn_g_dlambda_per_nm], reason: "mrm.materials (Li 1980 shape on the Frey level) inside the modes artefact"}
      "Si thermo-optic coefficient": {status: key, keys: [ring.thermal.dlambda_dt_pm_per_k, ring.thermal.dlambda_dt_beta_per_k], reason: "mrm.materials dn/dT(lambda, T) inside the modes artefact; R1 enforces one anchor"}
      "cladding and BOX geometry and indices": {status: key, keys: [ring.optics.index_weight_oxide], reason: "2 um BOX (GF-IMAPS printed) and oxide indices are inputs of the modes and thermal artefacts; the oxide index weight is the runtime trace"}
      "metal/heater geometry": {status: unknown, keys: [uncertainty.thermal.family, ring.thermal.pd_offset_um, ring.thermal.driver_offset_um], reason: "heater type and position are unpublished (07 Q1); carried as the heater-family hypothesis (in-ring, GF-PDK silicide undercut, metal above)"}
      "doped junction geometry": {status: unknown, keys: [ring.junction.fill_fraction, ring.junction.eff_at_0v_pm_per_v], reason: "doping and junction position unpublished; the junction artefact sweeps assumed profiles; fill_fraction is calibrated to CAL-5 later"}
      "fabrication width/thickness variation": {status: key, keys: [variation.geometry], reason: "correlated geometry draws through the Jacobian (07 P1-16), sized to the Berkeley 6 nm / 2 nm resonance spreads"}
      "sidewall roughness": {status: key, keys: [ring.optics.loss_budget.alpha_scatter_db_per_cm, ring.optics.backscatter_splitting_ghz]}
      "layer alignment/process variation": {status: key, keys: [variation.geometry], reason: "width and film die and ring components sized to the total Berkeley resonance spread, so slab-depth and implant misalignment are folded in (the latter moves fill_fraction and the junction LUT, both calibrated)"}
      "thermal expansion": {status: key, keys: [ring.optics.alpha_l_per_k, ring.optics.alpha_l_slope_per_k2]}
      "stress-optic effects": {status: excluded, reason: "below 2 pm/K (06 section 2.7), inside the dlambda/dT anchor uncertainty; R1 takes the measured-or-solved total"}
    B:
      "reference resonance frequency": {status: key, keys: [ring.optics.resonance_offset_nm, ring.optics.resonance_offset_ref_temp_c, channel_plan.center_thz]}
      "n_eff": {status: key, keys: [ring.optics.n_eff]}
      "n_g": {status: key, keys: [ring.optics.n_g]}
      "FSR": {status: key, keys: [ring.optics.fsr_thz, uncertainty.fsr]}
      "intrinsic loss": {status: key, keys: [ring.optics.loss_budget.alpha_fca_db_per_cm, ring.optics.loss_budget.alpha_other_abs_db_per_cm, ring.optics.loss_budget.alpha_scatter_db_per_cm, ring.optics.loss_budget.alpha_bend_radiation_db_per_cm], reason: "07 P0-2 loss budget; Q_i and eta are derived"}
      "bus coupling": {status: key, keys: [ring.optics.q_through, ring.optics.kappa_d_over_kappa, uncertainty.coupling_regime]}
      "loaded/intrinsic Q": {status: key, keys: [ring.optics.q_loaded, ring.optics.q_intrinsic, uncertainty.q_loaded]}
      "coupler phase and wavelength dependence": {status: key, keys: [ring.optics.dln_kappa2_through_dlambda_per_nm, ring.optics.dln_kappa2_drop_dlambda_per_nm], reason: "wavelength dependence modelled per line (07 P1-5); the constant coupler phase is absorbed by the measured resonance offset (it shifts every order equally), so it has no key"}
      "linewidth": {status: key, keys: [ring.optics.q_loaded], reason: "FWHM = c/(lambda Q_L), derived"}
      "extinction/notch depth": {status: key, keys: [ring.optics.q_loaded, ring.optics.loss_budget.alpha_other_abs_db_per_cm, uncertainty.coupling_regime, uncertainty.er_mechanism], reason: "follows from the Q split of the exact add-drop ring; set to the G25 27.9 dB at 0 V and the nominal Q_L"}
      "through- and monitor-port transfer functions": {status: key, keys: [fidelity.optics_model], reason: "exact add-drop ring per line and order (mrm.plant.optics)"}
      "group delay": {status: key, keys: [fidelity.optics_model], reason: "contained in the exact ring response; not a separate parameter"}
      "backreflection/backscattering": {status: key, keys: [fidelity.backscatter, ring.optics.backscatter_splitting_ghz]}
      "mode splitting": {status: key, keys: [ring.optics.backscatter_splitting_ghz]}
      "polarization dependence (TE/TM)": {status: excluded, reason: "TE only (channel_plan line pol te); the TM0 mode is not guided in the bend of the solved strip (modes artefact mode_families) and parasitic families are 07 P2-3, deferred"}
      "higher-order transverse modes": {status: excluded, reason: "TE1 is not guided in the solved cross-section (modes artefact mode_families); parasitic mode families are 07 P2-3, deferred"}
      "coupling between adjacent resonators": {status: excluded, reason: "rings on one bus are tens of um apart, so they couple only through the bus field, which the bus cascade of mrm.plant.optics models exactly; no evanescent ring-ring coupling"}
      "intracavity energy": {status: key, keys: [fidelity.optics_model], reason: "an output of the exact ring (drives absorption and the monitor)"}
    C:
      "thermal resistance": {status: key, keys: [ring.thermal.z_heater_ring_k_per_mw, ring.thermal.z_ratio_opt_heater, uncertainty.self_heating.z_ratio], reason: "Z_heater->ring is derived (R2) from P_FSR and dlambda/dT; Z_opt/Z_heater is an interval"}
      "capacitance": {status: key, keys: [ring.thermal.tau_fast_s, ring.thermal.tau_slow_s], reason: "implicit in the Foster poles tau_k = R_k C_k"}
      "time constants": {status: key, keys: [ring.thermal.tau_fast_s, ring.thermal.tau_slow_s, ring.thermal.tail_tau_s, ring.thermal.selfheat_tau_s, uncertainty.thermal.time_scale_fast, uncertainty.thermal.time_scale_slow]}
      "resonance shift per kelvin": {status: key, keys: [ring.thermal.dlambda_dt_pm_per_k, uncertainty.thermo_optic]}
      "reference temperature": {status: key, keys: [ring.thermal.dlambda_dt_ref_ring_temp_c, ring.optics.resonance_offset_ref_temp_c, ring.heater.r_ref_temp_c]}
      "heater power to resonance shift": {status: key, keys: [ring.heater.p_fsr_mw, ring.heater.efficiency_nm_per_mw], reason: "P_FSR is the anchor (07 D16); the efficiency is derived"}
      "heater-to-ring delay": {status: key, keys: [uncertainty.thermal.transport_delay_s, ring.thermal.tau_fast_s]}
      "inter-ring thermal coupling": {status: key, keys: [ring.thermal.xt_nearest_frac, ring.thermal.xt_next_frac, ring.thermal.xt_floor_frac, ring.thermal.xt_tau_ref_s, uncertainty.thermal.crosstalk_scale]}
      "multiple thermal modes": {status: key, keys: [ring.thermal.tau_fast_s, ring.thermal.tau_slow_s, ring.thermal.tail_tau_s, ring.thermal.selfheat_tau_s, fidelity.thermal_model], reason: "three heater poles plus a sub-us self-heating pole (interim) or the FEM Foster ROM"}
      "spatial gradients across the ring": {status: excluded, reason: "the ring is one mode-weighted temperature (the ROM observer ring_mode_weighted); a gradient shifts the resonance only through its mode-weighted mean to first order"}
      "package boundary conditions": {status: key, keys: [ring.thermal.tail_tau_s, ring.thermal.tail_share_frac, uncertainty.thermal.package_tail_tau_s, uncertainty.thermal.package_tail_share_frac], reason: "the package enters as a 1-10 ms tail carrying 2-10 % (07 P1-2); package thermal resistance itself is unpublished"}
      "T-dependent thermal conductivity and heat capacity": {status: excluded, reason: "not wired yet although 07 P2-5 is in the v1 scope (ARCHITECTURE 0): mrm.plant.thermal.k_temp_residue_scale and the FEM sidecar k_temp_scaling exist, but no schema switch or realize path reaches them (requested in docs/handoff/params_content.md). Meanwhile the dn/dT(T) rise is in dlambda_dt_beta_per_k, and the oxide-dominated R_th changes only a few % (06 N8)"}
      "optical absorption heating": {status: key, keys: [fidelity.self_heating, ring.optics.heat_fraction, uncertainty.self_heating.eta]}
      "data-driver heating": {status: key, keys: [driver.static_power_mw, driver.energy_per_transition_fj, ring.junction.capacitance_at_0v_ff, ring.thermal.driver_offset_um]}
      "external chip/package heat sources": {status: key, keys: [scenario.aggressor, layout.sites], reason: "on-die aggressor as power into the thermal model at a site (07 P1-4); XPU and package events are scenario signals"}
      "heat sink/cooling response": {status: key, keys: [ring.thermal.tail_tau_s, uncertainty.thermal.package_tail_tau_s], reason: "the slowest pole; the cold plate itself is a scenario base temperature"}
      "TEC dynamics": {status: unknown, keys: [scenario.stack], reason: "no TEC data; the TEC or package temperature is a scenario base-temperature signal (35-105 degC soak), filtered by the scenario if wanted"}
      "device-to-device thermal variation": {status: key, keys: [variation.ring.heater.p_fsr_mw, variation.ring.heater.r_cold_ohm], reason: "per-ring heater efficiency spread; the time scales are die-level world draws (07 D15)"}
    D:
      "resistance or I-V curve": {status: key, keys: [ring.heater.r_cold_ohm, ring.heater.tcr_per_k, ring.thermal.heater_self_ratio]}
      "resistance vs temperature": {status: key, keys: [ring.heater.tcr_per_k, ring.heater.r_ref_temp_c, uncertainty.thermal.family]}
      "driver output limits": {status: key, keys: [ring.heater.full_scale_v, ring.heater.full_scale_a, ring.heater.full_scale_w, ring.heater.code_max]}
      "DAC resolution": {status: key, keys: [ring.heater.dac_bits, ring.heater.pwm_bits]}
      "DAC gain/offset error": {status: key, keys: [ring.heater.dac_inl_lsb, ring.heater.dac_dnl_lsb], reason: "INL/DNL drawn per device; a static gain error is equivalent to a full-scale error and is inside the driver-law hypothesis"}
      "output noise": {status: excluded, reason: "no key: one LSB of the 16-bit voltage DAC is 0.2-0.5 pm of resonance at the G26 lock codes (derive heater_pm_per_code) and the >= 1 us thermal poles filter it further; the bias DAC noise is keyed (ring.bias_dac.noise_rms_codes)"}
      "command latency": {status: key, keys: [ring.heater.latency_s, uncertainty.timing.latency_scale]}
      "settling time": {status: key, keys: [ring.heater.settle_tau_s]}
      "update rate": {status: key, keys: [ring.heater.dac_max_update_hz, controller_interface.update_rate_hz]}
      "slew limit": {status: key, keys: [ring.heater.slew_codes_per_s], reason: "absent = unlimited on purpose (07 P1-11: the 460 codes/ms of the textbook is measured demand, not hardware); the metrics report the demanded peak slew"}
      "supply voltage and ripple": {status: unknown, keys: [ring.heater.driver_compliance_v, array.heater_supply_current_max_a], reason: "supply voltage taken from the GF IO rail (1.8 V printed); ripple is unpublished and not modelled (it would act like DAC noise, filtered by the thermal poles)"}
      "PWM frequency/duty/ripple (if PWM)": {status: key, keys: [ring.heater.pwm_period_s, ring.heater.pwm_bits, fidelity.heater_pwm_ripple]}
      "compliance and safety limits": {status: key, keys: [ring.heater.driver_compliance_v, array.heater_total_power_max_w, array.heater_supply_current_max_a]}
      "electrical crosstalk": {status: excluded, reason: "heater-to-heater supply coupling is modelled only as the array supply limit droop (07 P1-12); no shared-ground or IR-drop model (no data)"}
      "heater aging/drift": {status: unknown, reason: "no data; heater electromigration is reported for imec W heaters (CO-EM) but nothing for Lightmatter; not modelled"}
      "shutdown/fallback behaviour": {status: key, keys: [scenario.params], reason: "controller behaviour, not plant; fault masks such as controller_reset_at are scenario-bound (07 P1-10)"}
      "whether the command is voltage, current, power or a DAC code": {status: key, keys: [ring.heater.driver_mode, uncertainty.heater.driver_mode]}
    E:
      "mechanism (depletion/injection)": {status: key, keys: [fidelity.junction_model], reason: "depletion PN (LM26-S slide 7, printed)"}
      "drive levels": {status: key, keys: [driver.swing_pp_v, driver.level_convention, uncertainty.driver.levels]}
      "bias and polarity": {status: key, keys: [ring.bias_dac.v_min_v, ring.bias_dac.v_max_v, scenario.bias_v, ring.optics.resonance_offset_ref_bias_v]}
      "junction C(V)": {status: key, keys: [ring.junction.capacitance_at_0v_ff, ring.junction.v_bi_v, ring.junction.depletion_exponent]}
      "junction resistance and parasitics": {status: key, keys: [ring.junction.series_resistance_ohm]}
      "carrier concentration vs bias": {status: key, keys: [fidelity.junction_model], reason: "carriers live in the junction artefact (devsim, junction_<xsec>.json); the analytic law is the runtime fallback"}
      "dn_eff/dV": {status: key, keys: [ring.junction.eff_at_0v_pm_per_v, ring.junction.fill_fraction]}
      "dalpha/dV": {status: key, keys: [ring.junction.loss_ratio_q]}
      "modulation bandwidth": {status: key, keys: [ring.junction.capacitance_at_0v_ff, ring.junction.series_resistance_ohm, driver.output_resistance_ohm], reason: "RC x optical response, waveform mode only; CAL-10 calibrates it"}
      "driver output impedance": {status: key, keys: [driver.output_resistance_ohm]}
      "package RLC": {status: excluded, reason: "the driver is monolithic (LM26-P: monolithically integrated CMOS drivers), so no package interconnect sits between driver and junction"}
      "data pattern and transition density": {status: key, keys: [datapath.transition_density, fidelity.pattern_noise]}
      "rise/fall times": {status: excluded, reason: "bit-level shape; the control plant averages over mark density (07 P2-6); the waveform module handles it"}
      "driver jitter and noise": {status: excluded, reason: "bit-level timing does not reach the thermal loop (20 ps UI against >= 1 us thermal poles); it affects only the eye, which is not a plant output"}
      "self-heating from data activity": {status: key, keys: [driver.swing_pp_v, ring.junction.capacitance_at_0v_ff, datapath.transition_density, driver.energy_per_transition_fj]}
    F:
      "centre wavelength": {status: key, keys: [channel_plan.center_thz, channel_plan.spacing_ghz]}
      "power": {status: key, keys: [laser.power_per_line_dbm, uncertainty.chip_input_loss]}
      "frequency drift": {status: key, keys: [scenario.stack], reason: "slow drift (0.02 nm / 24 h) is a scenario signal (CAL-12)"}
      "absolute accuracy": {status: key, keys: [laser.line_offset_ghz, variation.laser.line_offset_ghz]}
      "RIN": {status: key, keys: [laser.rin_db_per_hz]}
      "linewidth/phase noise": {status: key, keys: [laser.linewidth_mhz]}
      "power noise": {status: key, keys: [laser.rin_db_per_hz], reason: "fast power noise is RIN; slow power drift (2.5 % / 24 h) is a scenario signal"}
      "polarization state": {status: unknown, keys: [channel_plan.center_thz], reason: "whether the TX feed is polarization maintaining is unpublished (06 S7); lines are TE"}
      "tuning rate (if controllable)": {status: key, keys: [laser.tune.present, laser.tune.lsb_hz]}
      "laser thermal/electrical dynamics": {status: unknown, reason: "the Guide wavelength servo is unpublished (PAT-7 titles only); laser lines move only through scenario signals"}
      "input coupling loss": {status: key, keys: [optical_path.chip_input_loss_db]}
      "reflections into the laser": {status: excluded, reason: "external reflection (07 P2-2 scenario.external_reflection) is not built (plant_optics handoff 5.5); no laser feedback model"}
      "multiple WDM carriers": {status: key, keys: [channel_plan.n_lines, channel_plan.ring_to_line]}
    G:
      "monitor placement/topology": {status: key, keys: [ring.thermal.pd_offset_um, ring.optics.kappa_d_over_kappa], reason: "drop-port PD per ring (LM26-P printed)"}
      "responsivity": {status: key, keys: [ring.monitor.responsivity_a_per_w, variation.ring.monitor.responsivity_a_per_w]}
      "dark current": {status: key, keys: [ring.monitor.dark_i0_na, ring.monitor.dark_activation_ev, uncertainty.monitor.dark_i0]}
      "shot noise": {status: key, keys: [fidelity.shot_noise]}
      "electronic noise": {status: key, keys: [ring.monitor.input_noise_pa_per_rt_hz, ring.monitor.flicker_corner_hz]}
      "monitor bandwidth": {status: key, keys: [ring.monitor.afe_type, ring.monitor.integration_window_s]}
      "ADC resolution": {status: key, keys: [ring.monitor.adc_bits]}
      "ADC reference/gain/offset": {status: key, keys: [ring.monitor.adc_offset_codes, ring.monitor.adc_gain_error_frac, ring.monitor.adc_ref_tempco_ppm_per_k, ring.monitor.adc_full_scale_ua]}
      "ADC sample rate": {status: key, keys: [ring.monitor.adc_rate_hz]}
      "measurement latency": {status: key, keys: [ring.monitor.adc_latency_s]}
      "analog filtering": {status: key, keys: [ring.monitor.afe_type, ring.monitor.integration_window_s]}
      "saturation/clipping": {status: key, keys: [ring.monitor.adc_full_scale_ua, ring.monitor.pga_gains]}
      "temperature-dependent monitor response": {status: key, keys: [ring.monitor.dark_activation_ev, ring.monitor.adc_ref_tempco_ppm_per_k], reason: "dark current follows the PD temperature (Arrhenius); responsivity is held constant (02 section 10: no 1310 nm data, assumed +-3 %)"}
      "monitor crosstalk": {status: key, keys: [ring.monitor.background_fraction, fidelity.optics_model], reason: "neighbour lines and other orders reach the drop port through the exact bus cascade; stray light is background_fraction"}
      "dropped samples": {status: key, keys: [scenario.params], reason: "fault masks adc_drop_mask, adc_stuck, adc_saturate (07 P1-10) are scenario-bound"}
      "calibration tones and dither": {status: excluded, reason: "a dither is a controller action on tx.heater or tx.bias (07 P0-7 fast_kernel), not a plant parameter"}
      "sensor synchronization": {status: key, keys: [ring.monitor.adc_mux.channels_per_adc, ring.monitor.adc_mux.order, sim.dt_plant_s]}
    H:
      "linear absorption heating": {status: key, keys: [fidelity.self_heating, ring.optics.heat_fraction]}
      "TPA": {status: excluded, reason: "07 P2-1: TPA loss < 0.2 dB/cm against ~110 dB/cm intrinsic at +9 dBm and Q 4200 (bound test); fidelity.nonlinear_optics stays off"}
      "free-carrier generation": {status: excluded, reason: "07 P2-1: TPA-generated carriers shift < 5 pm at 1 ns lifetime, < 0.5 pm with junction sweep-out"}
      "FCA": {status: excluded, reason: "TPA-generated FCA is excluded with the 07 P2-1 bound; the doping FCA is the alpha_fca_db_per_cm term of the loss budget"}
      "free-carrier dispersion": {status: excluded, reason: "TPA-carrier dispersion excluded by the 07 P2-1 bound; bias-driven carrier dispersion is the junction model"}
      "carrier lifetime": {status: excluded, reason: "only matters for TPA carriers (07 P2-1 bound, 10-100 ps in reverse bias)"}
      "Kerr": {status: excluded, reason: "07 P2-1: Kerr shift < 1 pm at +9 dBm"}
      "thermo-optic bistability": {status: key, keys: [fidelity.self_heating, sim.reset_protocol]}
      "resonance hysteresis": {status: key, keys: [fidelity.self_heating, sim.reset_protocol]}
      "backscatter/counter-propagating modes": {status: key, keys: [fidelity.backscatter, ring.optics.backscatter_splitting_ghz]}
      "operating-point dependent resonance shape": {status: key, keys: [fidelity.self_heating, fidelity.optics_model], reason: "self-heating distorts the swept line shape; the exact ring is solved at each temperature"}
    I:
      "number and order of rings": {status: key, keys: [array.n_rings, array.bus_order]}
      "ring-to-wavelength assignment": {status: key, keys: [channel_plan.ring_to_line, controller_interface.bind.tx.assignment]}
      "per-ring spectra": {status: key, keys: [fidelity.optics_model, variation.geometry]}
      "per-ring heaters and offsets": {status: key, keys: [ring.optics.resonance_offset_nm, variation.geometry, variation.ring.heater.p_fsr_mw]}
      "common-bus loss and phase": {status: key, keys: [optical_path.bus_loss_db_per_mm, optical_path.ring_spacing_on_bus_um], reason: "loss modelled; the bus phase between rings matters only with reflections (07 P2-10 netlist, deferred)"}
      "inter-ring thermal and optical coupling": {status: key, keys: [ring.thermal.xt_nearest_frac, fidelity.optics_model]}
      "wavelength-dependent couplers": {status: key, keys: [ring.optics.dln_kappa2_through_dlambda_per_nm, ring.optics.dln_kappa2_drop_dlambda_per_nm]}
      "reflections between components": {status: excluded, reason: "single-pass bus (plant_optics bound L_BOUND < 1e-3 in normal operation); multi-element reflections need the 07 P2-10 S-matrix netlist, deferred"}
      "RX add-drop filters": {status: excluded, reason: "the plant is the TX bank; the RX path has no controller-relevant loop in this model"}
      "interleaver transfer functions": {status: excluded, reason: "no interleaver element yet (07 P2-10 deferred); its leakage onto the TX bus is not modelled"}
      "TX/RX grid offsets": {status: key, keys: [channel_plan.lines, channel_plan.center_thz], reason: "the 200 GHz-offset RX comb can be added as lines with direction rx; the TX set centre is 100 GHz below the composite centre"}
      "interleaver IL, isolation, dispersion": {status: excluded, reason: "no interleaver element (07 P2-10 deferred); values unpublished (textbook SOURCES section 5)"}
      "RX photodiodes and TIAs": {status: excluded, reason: "RX path not modelled; the BER uses an OMA-to-BER law in the datapath module"}
      "polarization rotation/PDL": {status: excluded, reason: "TX bus only; the polarization scramble acts on the RX-path monitors (07 D14)"}
      "bidirectional interference/backscatter": {status: key, keys: [fidelity.backscatter, ring.optics.backscatter_splitting_ghz], reason: "backscatter per order modelled (07 P2-2); external reflection not built"}
      "fibre/connector loss and reflections": {status: key, keys: [optical_path.chip_input_loss_db, scenario.stack], reason: "loss in chip_input_loss_db; connector re-mates are scenario loss steps (A6); reflections excluded (see reflections into the laser)"}
      "channel crosstalk": {status: key, keys: [fidelity.optics_model, channel_plan.spacing_ghz]}
      "laser source correlation and drift": {status: key, keys: [variation.laser.line_offset_ghz], reason: "die_sigma is the common-mode error of one laser module, line_sigma the per-line error"}
      "die thermal variation": {status: key, keys: [layout.sites, scenario.aggressor, temp_sensors]}
      "multi-controller synchronization and sequencing": {status: key, keys: [controller_interface.schedule, array.heater_total_power_max_w]}
    J:
      "modulation format": {status: key, keys: [datapath.bitrate_gbps], reason: "NRZ (LM26-P)"}
      "OMA": {status: key, keys: [metrics.reloma_definition, driver.swing_pp_v]}
      "ER": {status: key, keys: [ring.optics.q_loaded, uncertainty.er_mechanism]}
      "IL": {status: key, keys: [fidelity.optics_model, optical_path.bus_loss_db_per_mm]}
      "eye height/width": {status: excluded, reason: "waveform-mode output only (07 P2-6); not a plant parameter"}
      "rise/fall": {status: excluded, reason: "waveform mode (see E rise/fall times)"}
      "received power": {status: excluded, reason: "RX link budget not modelled; 07 4.7 uses BER only for feasibility"}
      "receiver noise and sensitivity": {status: excluded, reason: "RX path not modelled; the datapath BER law carries the G26 sensitivity read-off"}
      "jitter": {status: excluded, reason: "bit-level timing, no thermal-loop path"}
      "ISI": {status: excluded, reason: "waveform mode (07 P2-6)"}
      "crosstalk penalty": {status: key, keys: [ring.optics.fsr_thz, channel_plan.spacing_ghz], reason: "BND-1 diagnostic next_order_distance_* from derive()"}
      "pre-FEC BER": {status: key, keys: [datapath.bitrate_gbps], reason: "rx.error_count drawn as Poisson(sum BER(OMA) bits) (07 P0-11)"}
      "BER observation interval": {status: key, keys: [datapath.error_count_period_s, metrics.ber_sample_period_s]}
      "error-counter latency": {status: key, keys: [datapath.error_count_latency_s]}
    K:
      "initial temperatures and heater codes": {status: key, keys: [sim.reset_protocol, ring.heater.code_min]}
      "initial optical/electrical states": {status: key, keys: [sim.reset_protocol, sim.reset_ramp_s]}
      "initial resonance offsets and lock status": {status: key, keys: [ring.optics.resonance_offset_nm, sim.reset_protocol]}
      "ambient temperature vs time": {status: key, keys: [scenario.ambient_c, scenario.stack]}
      "package/board temperature vs time": {status: key, keys: [scenario.stack]}
      "spatial external heating": {status: key, keys: [scenario.aggressor, layout.sites]}
      "laser drift vs time": {status: key, keys: [scenario.stack]}
      "supply disturbances": {status: unknown, reason: "no data on heater or driver supply disturbances; scenario.bias_offset_v carries bias ripple or droop"}
      "device-to-device variation": {status: key, keys: [variation.geometry, variation.ring.heater.p_fsr_mw]}
      "process corners and correlated errors": {status: key, keys: [variation.geometry], reason: "die and ring components; corners are the thin corner presets"}
      "noise distributions": {status: key, keys: [fidelity.shot_noise, ring.monitor.input_noise_pa_per_rt_hz, laser.rin_db_per_hz]}
      "sample rates and event timing": {status: key, keys: [sim.dt_plant_s, ring.monitor.adc_rate_hz, controller_interface.update_rate_hz]}
      "integration step and tolerances": {status: key, keys: [sim.dt_plant_s, sim.substep_policy, sim.max_detuning_step_pm]}
      "random seeds": {status: key, keys: [experiment.seeds.device, experiment.seeds.uncertainty]}
      "fault injection (lost samples, saturation)": {status: key, keys: [scenario.params], reason: "07 P1-10 scenario-bound masks"}
      "parameter validity ranges": {status: key, keys: [ring.optics.q_loaded], reason: "every leaf carries a range where one is known; the schema holds hard bounds"}
      "uncertainty and extrapolation warnings": {status: key, keys: [uncertainty.thermo_optic], reason: "the uncertainty section; mrm.materials warns outside its model ranges"}
      "test configurations and expected reference outputs": {status: key, keys: [experiment.kind], reason: "mrm/validation/targets (frozen) and tests/golden"}
    OFC2026_not_given:
      "heater resistance": {status: key, keys: [ring.heater.r_cold_ohm], reason: "taken from G25 (LM-T wafer maps via the textbook)"}
      "limits": {status: unknown, keys: [ring.heater.full_scale_v, ring.heater.code_max], reason: "assumed hardware limits (07 P1-11)"}
      "time constants": {status: unknown, keys: [ring.thermal.tau_fast_s, uncertainty.thermal.time_scale_fast], reason: "no Lightmatter value; imec literature and a 0.5-2x world scale (07 Q1)"}
      "geometry": {status: unknown, keys: [ring.geometry.film_nm, uncertainty.film_thickness], reason: "GF 45SPCLO 160 nm film printed; width, slab and radius assumed or derived"}
      "indices": {status: key, keys: [ring.optics.n_eff, ring.optics.n_g], reason: "solved for the assumed cross-section"}
      "coupling": {status: unknown, keys: [ring.optics.kappa_d_over_kappa, uncertainty.coupling_regime], reason: "only Q_L and the G25 notch are measured; the split is a hypothesis"}
      "spectra": {status: key, keys: [ring.optics.q_loaded], reason: "G25 heater-sweep spectra (read-off) via CAL-1, CAL-2, CAL-4"}
      "junction": {status: key, keys: [ring.junction.eff_at_0v_pm_per_v], reason: "G25 bias ladder (read-off) fit; doping unknown"}
      "monitor ADC details": {status: unknown, keys: [ring.monitor.adc_bits, ring.monitor.adc_rate_hz], reason: "PAT-2 integrating ADC inferred; width, rate, latency assumed"}
      "controller": {status: unknown, keys: [controller.name], reason: "the entire control loop is unpublished; that is the capstone"}
      "crosstalk": {status: unknown, keys: [ring.thermal.xt_nearest_frac], reason: "imec literature (1-10 %); PAT-1 calls it negligible"}
      "production distributions": {status: unknown, keys: [variation.geometry, variation.ring.heater.p_fsr_mw], reason: "G25 60-die wafer maps (P_FSR, R) and 500-part responsivity only; geometry spread from Berkeley literature"}

fidelity:
  self_heating: "on"                 # 07 P0-1 item 1: on in every preset except teaching_*
  thermo_optic_order: 2              # 07 P0-3: s(T) = s0 (1 + beta (T - T0))
  thermal_model: interim             # ARCHITECTURE 5.3 / 07 P1-2: interim until the FEM ROM passes the calibration split
  junction_model: analytic           # the junction LUT artefact is not extracted yet (ARCHITECTURE 5.4)
  optics_model: exact
  backscatter: "off"                 # schema default; turn on for BiDi and reflection studies (cost, plant_optics 2)
  shot_noise: "on"
  pattern_noise: "off"
  data_modulation: mean
  nonlinear_optics: "off"            # 07 P2-1: excluded with a computed bound
  heater_anchor: fsr_integral       # R2: Z = dT_FSR/P_FSR, the exact inversion of the P_FSR anchor (07 D16); 07 P0-3
                                   # lock_slope is 4-5 % low and offset-dependent (integrator decision,
                                   # docs/handoff/integrator.md; lock_slope stays selectable with --set)
  heater_pwm_ripple: "off"
  plasma_dispersion: nedeljkovic2011

sim:
  dt_plant_s: 1.0e-6                 # 07 P0-1 item 3 keeps 1 us (implicit self-heating solve)
  substep_policy: fixed
  reset_protocol: laser_ramp         # 07 P0-1 item 6
  # 07 P0-1 item 6: lasers ramp over >= 10 tau_slow. tau_slow x time_scale_slow is at most 2 x 45.7 us (undercut
  # family) in the drawn worlds and 300 us in the textbook corner (time scales pinned at 1), so 3 ms covers every
  # preset (the textbook family with a drawn x2 slow scale would need 6 ms). MODEL choice.
  reset_ramp_s: 3.0e-3

channel_plan:
  center_thz:
    value: 228.749
    provenance: inferred
    generation: G26
    source: LM26-P
    textbook: REF.lambdaNm
    note: >-
      Printed: two sets of 8 lines on a 400 GHz grid, centred at 1310 nm (c/1310 nm = 228.849 THz), offset by 200 GHz.
      So each direction's set sits 100 GHz from the composite centre; which set is TX is not printed (assumed: the
      lower one). Lines 227.349-230.149 THz = 1318.6-1302.6 nm.
  spacing_ghz: {value: 400.0, provenance: printed, generation: G26, source: LM26-P, textbook: REF.perDirectionGridGHz,
                note: "spacing seen by one ring bank (the composite fibre grid is 200 GHz)"}
  n_lines: {value: 8, provenance: printed, generation: G26, source: LM26-P, textbook: REF.nChannels}
  ring_to_line: {value: [0, 1, 2, 3, 4, 5, 6, 7], provenance: assumed, generation: none, source: MODEL,
                 note: "identity assignment (07 P1-12: the controller may remap through tx.assignment)"}

laser:
  power_per_line_dbm:
    value: 10.0
    provenance: printed
    generation: G26
    source: QDSOA
    range: [8.0, 11.0]
    textbook: REF.laserPerLambdaDbmM1000
    disagrees: "the textbook's 14 dBm per line for M1000 was not found in any public source (01 D16); the G26 hardware budget prints 10 dBm/line into the TX, and 100 mW/fibre over 16 lines is 8 dBm"
    note: "at the laser-module output (07 P0-1 item 4); the power at the first ring is this minus optical_path.chip_input_loss_db"
    alternatives:
      guide_16_lines: {value: 8.0, provenance: inferred, generation: Guide, source: HC, note: "100 mW per fibre shared by 16 lines"}
  line_offset_ghz:
    value: 0.0
    provenance: assumed
    generation: G26
    source: MODEL
    range: [-20.0, 20.0]
    textbook: REF.laserAccuracyGhz
    note: "static error of each line from the grid; the spread is variation.laser.line_offset_ghz; +-20 GHz is the printed requirement (LM26-P section 4)"
  rin_db_per_hz:
    value: -145.0
    provenance: assumed
    generation: none
    source: MODEL
    range: [-155.0, -135.0]
    note: "no Lightmatter or Guide RIN is published; a typical DFB value, unknown (inventory F)"
  linewidth_mhz:
    value: 1.0
    provenance: printed
    generation: Guide
    source: WPW
    range: [0.1, 1.0]
    textbook: REF.laserLinewidthMhz
    note: "ELS linewidth <= 1 MHz (WPW, a requirement); the textbook lists 0.5 MHz measured"
    alternatives:
      measured: {value: 0.5, provenance: printed, generation: Guide, source: textbook-REF}
  tune:
    present: false

optical_path:
  chip_input_loss_db:
    value: 6.0
    provenance: inferred
    generation: G25
    source: LM-P
    range: [2.0, 10.0]
    textbook: REF.inputPowerDbm
    note: "chosen so that the G26 10 dBm per line gives the G25 '~4 dBm' input at the ring (LM-P section 3.2); the uncertainty spans 0 to +8 dBm at the ring (07 4.8)"
  bus_loss_db_per_mm:
    value: 0.073
    provenance: printed
    generation: GF
    source: GF-BIAN
    range: [0.073, 0.1]
    note: "GF 45SPCLO SOI rib 0.73 dB/cm (ridge 1.0 dB/cm)"
  ring_spacing_on_bus_um: {value: 50.0, provenance: assumed, generation: none, source: MODEL,
                           note: "equal to layout.ring_pitch_um (unpublished)"}

ring:
  geometry:
    radius_um:
      value: null
      provenance: derived
      textbook: REF.radiusUm
      note: "R3: r_ref = c/(2 pi n_g FSR), about 6.6 um for window B at n_g 4.0; the printed '~15 um diameter' (LM26-S, HC) fits 1.8 THz only if it is an outer dimension (01 section 4.4)"
    width_nm: {value: 400.0, provenance: assumed, generation: none, source: SMTAI, range: [360.0, 450.0],
               note: "rib width at mid-height: the SMTAI render (400) and the BU 45CLO rib (410); informational (sets the artefact)",
               alternatives: {strip400x200: {value: 400.0, provenance: printed, source: SMTAI}}}
    film_nm:
      value: 160.0
      provenance: printed
      generation: GF
      source: GF-IMAPS
      range: [150.0, 210.0]
      textbook: REF.waveguideLmNm
      disagrees: "the textbook uses the 400 x 200 nm SMTAI render; GF 45SPCLO prints a 160 nm photonics film and G25 is printed as 45SPCLO (01 D1, 07 D21); 200 nm stays a hypothesis"
      alternatives:
        strip400x200: {value: 200.0, provenance: printed, generation: none, source: SMTAI}
    slab_nm:
      value: 60.0
      provenance: assumed
      generation: none
      source: MODEL
      range: [0.0, 100.0]
      note: "partial-etch depth is not public; 60 nm on 160 nm (slab/film 0.375, typical foundry ribs; mrm.extraction.common XSECS rib160)"
      alternatives:
        strip400x200: {value: 0.0, provenance: printed, generation: none, source: SMTAI}
    xsec: rib160
    jacobian:
      value: {from: "extracted/modes_rib160.json:jacobian"}
      provenance: solver(assumed-geometry)
      generation: none
      source: X-MODES
      note: "d(lambda_res, n_eff, n_g, dlambda/dT, alpha_rad)/d(width, film[, slab]) at fixed r_ref and order (07 P1-16)"
      alternatives:
        fallback:
          value:
            d: [width_nm, film_nm]
            of:
              lambda_res_nm_per_nm: [0.652, 1.19]
              n_eff_per_nm: [0.00216, 0.00395]
              n_g_per_nm: [-0.00236, 0.00058]
              dlambda_dt_pm_per_k_per_nm: [0.026, 0.038]
          provenance: inferred
          generation: none
          source: X-MODES
          note: "the 400 x 200 nm strip Jacobian (modes_strip400x200.json) applied to the 160 nm rib until modes_rib160 exists"
        strip400x200: {from: "extracted/modes_strip400x200.json:jacobian", provenance: solver(assumed-geometry), generation: none, source: X-MODES}
  optics:
    resonance_offset_nm:
      value: 7.6
      provenance: inferred
      generation: G25
      source: LM-T
      range: [5.0, 10.0]
      textbook: REF.blueBiasMeasuredNm
      note: "cold-cavity blue offset of each ring from its own line: 1309.5 nm line minus the 1301.90 nm resonance at 0 V heater (CAL-7; G25 read-off 1301.89 nm, 01 section 2.2); a scalar means every ring is designed 7.6 nm blue of its line (designed stagger)"
    resonance_offset_ref_temp_c: {value: 25.0, provenance: assumed, generation: G25, source: D07,
                                  note: "the G25 sweep temperature is not printed (BND-2 caveat); 25 degC is the wafer-map temperature"}
    resonance_offset_ref_bias_v: {value: 0.0, provenance: printed, generation: G25, source: LM-T,
                                  note: "the G25 heater sweep was taken at 0 V junction bias"}
    n_eff:
      value: {from: "extracted/modes_rib160.json:n_eff"}
      provenance: solver(assumed-geometry)
      generation: none
      source: X-MODES
      range: [2.2, 2.7]
      textbook: REF.neff
      note: "bent-mode n_eff at r_ref, 1310 nm, 25 degC; R3 absorbs the order rounding in n_eff (|correction| < lambda/(2L))"
      alternatives:
        fallback: {value: 2.40, provenance: inferred, generation: none, source: R01, note: "400 x 160 nm strip FD 2.36 (01 section 2.2) plus a slab"}
        strip400x200: {from: "extracted/modes_strip400x200.json:n_eff", provenance: solver(assumed-geometry), generation: none, source: X-MODES}
    n_g:
      value: {from: "extracted/modes_rib160.json:n_g"}
      provenance: solver(assumed-geometry)
      generation: none
      source: X-MODES
      range: [3.8, 4.4]
      textbook: REF.ng
      note: "group index of the bent mode at 1310 nm, 25 degC; with the FSR hypothesis it sets the radius (R3)"
      disagrees: "4.2 is assumed in the textbook and leans high for a 160 nm film (01 REF check: BU 45CLO rib 3.91-3.98, 400 x 160 strip 4.04-4.07)"
      alternatives:
        fallback: {value: 4.0, provenance: inferred, generation: none, source: BU-45CLO, note: "between the BU 45CLO rib ring (3.91-3.98, inferred from its FSR) and the 400 x 160 nm strip FD (4.07, 01)"}
        strip400x200: {from: "extracted/modes_strip400x200.json:n_g", provenance: solver(assumed-geometry), generation: none, source: X-MODES}
    dn_g_dlambda_per_nm:
      value: {from: "extracted/modes_rib160.json:dn_g_dlambda_per_nm"}
      provenance: solver(assumed-geometry)
      generation: none
      source: X-MODES
      note: "group-index dispersion of the bent mode (n_g at each line)"
      alternatives:
        fallback: {value: 1.4e-4, provenance: inferred, generation: none, source: X-MODES, note: "value of the 400 x 200 nm strip artefact"}
        strip400x200: {from: "extracted/modes_strip400x200.json:dn_g_dlambda_per_nm", provenance: solver(assumed-geometry), generation: none, source: X-MODES}
    fsr_thz:
      value: 1.8
      provenance: printed
      generation: G25
      source: LM-P
      range: [1.4, 1.9]
      textbook: REF.fsrTHz
      disagrees: "the textbook's measured bound FSR >= 14.1 nm is unsupported: the G25 traces are ~1 nm windows (01 D2, 07 D17)"
      note: "G25 design target (never measured); window B of 07 P1-6 = 1.72-1.88 THz; the patent claims FSR < 11.44 nm (PAT-4). The range spans every FSR hypothesis"
      alternatives:
        window_a: {value: 1.47, provenance: inferred, generation: none, source: VAL-TARGETS, note: "07 window A (1.32-1.48 THz) restricted to 1.46-1.48 THz: its interior puts a second order within 2 FWHM of a TX line (validation_targets review, BND-1)"}
        g25_cluster: {value: 1.53, provenance: read-off, generation: G25, source: R06, note: "stress: 8.7-8.8 nm from the wafer maps and the 15 um diameter (06 O8); next order 1.0-1.3 FWHM from another lane"}
        pdk_size: {value: 1.60, provenance: inferred, generation: GF, source: GF-ECIO, note: "stress: R = 7.5 um (GF PDK, '~15 um diameter') at n_g 3.9-4.04; next order on a line (BND-1)"}
        window_b_low: {value: 1.72, provenance: inferred, generation: none, source: D07, note: "edge of window B (exactly 2 FWHM, BND-1)"}
        window_b_high: {value: 1.88, provenance: inferred, generation: none, source: D07}
    q_loaded:
      value: 3850
      provenance: inferred
      generation: G25
      source: LM-T
      range: [2600, 4200]
      textbook: REF.Q
      disagrees: "the textbook uses the printed 3500 (talk) and lists the linewidth read-off 3900-4200 separately; we take the CAL-1 interval 3500-4200 with its midpoint as nominal (07 4.3, 4.8)"
      note: "anchor of R4 (q_through is derived); CAL-1 calibrates it; the coupling agent uses the same 3850 (coupling.Q_L_NOMINAL). Plausible 3500-4200 (the uncertainty interval); the range reaches the 2600 stress corner"
      alternatives:
        talk: {value: 3500, provenance: printed, source: LM-T}
        linewidth_low: {value: 3900, provenance: read-off, source: LM-T}
        linewidth_high: {value: 4200, provenance: read-off, source: LM-T}
        low_q: {value: 2600, provenance: assumed, source: R06, note: "stress corner (06 O6)"}
    kappa_d_over_kappa:
      value: 0.007
      provenance: inferred
      generation: G26
      source: D07
      range: [0.004, 0.18]
      note: >-
        drop decay rate over total (q_drop = q_loaded/x). 0.7 % is the log-centre of the [PHY] back-calculation 0.4-1.2 %
        from the ~15.5 uA G26 monitor current (07 D7; LM26-P Fig. 3b). In this preset's nominal world (+4 dBm at the
        ring, 0.95 A/W, the 27.9 dB G25 notch) it gives a drop peak of 0.0134 x P_in = 32 uA and 16 uA at a half-maximum
        lock (CAL-8 15-16 uA); a max-slope lock would need 0.45 %, a peak lock 0.34 %. (1 % would put the drop peak at
        46 uA, above the 40 uA ADC full scale.) The GF PDK '~5 % drop coupling' reading gives ~18 % (07 P1-9). Only the
        lumped monitor gain is calibrated (CAL-8); uncertainty.monitor.gain_scale carries the rest
      alternatives:
        phy_low: {value: 0.004, provenance: inferred, source: D07, note: "low end of the [PHY] back-calculation (07 D7)"}
        phy_high: {value: 0.012, provenance: inferred, source: D07, note: "high end of the [PHY] back-calculation (07 D7)"}
        gf_pdk: {value: 0.18, provenance: inferred, generation: GF, source: GF-ECIO, note: "5 % per-pass drop coupling on a near-critical ring. The drop decay then removes ~18 % of the energy, so the 27.9 dB G25 notch at Q_L 3850 needs Q_i ~12,000 (alpha_i ~70 dB/cm): selecting this alone gives an ~8.3 dB notch; rebalance the loss budget with it"}
        coupling_design: {value: 0.03, provenance: assumed, generation: none, source: X-COUPLING, note: "log-centre of the prior used for the coupling artefact's design drop gap (mrm.extraction.coupling KD_OVER_K_NOMINAL); rebalance the loss budget with it (the notch moves)"}
    dln_kappa2_through_dlambda_per_nm:
      value: {from: "extracted/coupling_rib160.json:through.dln_kappa2_dlambda_per_nm"}
      provenance: solver(assumed-geometry)
      generation: none
      source: X-COUPLING
      textbook: REF.erVsHeaterV
      disagrees: "the textbook interpolates the notch depth against heater voltage; under lock the heater moves while the resonance stays at the line, so the extinction is modelled from the coupler dispersion at each line and loss against temperature (06 O5, 07 P1-5)"
      note: "through-coupler dispersion at the design gap, evaluated at each line (07 P1-5). Do not use the 1.48 %/nm fit of 03: it used the held-out VAL-2 points (validation_targets contamination warning)"
      alternatives:
        fallback: {value: 0.014, provenance: inferred, generation: none, source: R05, note: "femwell coupled strips 1.3-1.5 %/nm (05 t02, 07 P1-5)"}
    dln_kappa2_drop_dlambda_per_nm:
      value: {from: "extracted/coupling_rib160.json:drop.dln_kappa2_dlambda_per_nm"}
      provenance: solver(assumed-geometry)
      generation: none
      source: X-COUPLING
      note: "drop coupler at its own larger gap (07 P1-9): sets the monitor-gain slope across the comb"
      alternatives:
        fallback: {value: 0.015, provenance: inferred, generation: none, source: R05, note: "same femwell range; a larger gap is slightly more dispersive"}
    dln_alpha_dt_ring_per_k:
      value: 0.0
      provenance: assumed
      generation: none
      source: D07
      range: [0.0, 0.005]
      note: "loss change with ring temperature; 0 under the dispersion ER mechanism (07 P1-5)"
      alternatives:
        ring_t_loss: {value: 2.0e-3, provenance: inferred, generation: G25, source: R01, note: "with the solver dispersion and an under-coupled start, makes the G25 notch fall from 27.9 dB (0 V) to ~20 dB at 1.2 V (CAL-2 points only, ring +~128 K); not fitted on VAL-2"}
    dln_alpha_dt_heater_per_k:
      value: 0.0
      provenance: assumed
      generation: none
      source: D07
      range: [0.0, 0.005]
      note: "loss change with heater temperature (heater doping overlapping the mode); the only mechanism with closed-loop ER drift (BND-4 bounds it)"
      alternatives:
        heater_t_loss: {value: 1.6e-3, provenance: inferred, generation: G25, source: R01, note: "the ring_t_loss value scaled by the heater/ring temperature-rise ratio (~1.25): same G25 notch at 1.2 V"}
    loss_budget:
      alpha_fca_db_per_cm:
        value: 80.0
        provenance: inferred
        generation: none
        source: NSM11
        range: [15.0, 135.0]
        textbook: "Ch17 eq. 17.7 eta_abs (0.3, assumed)"
