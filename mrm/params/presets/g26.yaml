      "fault injection (lost samples, saturation)": {status: key, keys: [scenario.params], reason: "07 P1-10 scenario-bound masks"}
      "parameter validity ranges": {status: key, keys: [ring.optics.q_loaded], reason: "every leaf carries a range where one is known; the schema holds hard bounds"}
