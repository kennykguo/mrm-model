  bind:
    tx:
      heater: controller
      bias: scenario
      assignment: scenario
    laser:
      tune: scenario
  knowledge: [line_grid, ring_to_line]  # 07 P1-12: the spec gives the bus order and the nominal grid only
  schedule: simultaneous
  on_out_of_range: clip

scenario:
