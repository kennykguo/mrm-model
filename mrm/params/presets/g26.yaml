    note: "on-chip resistive aggressor heater 'adjacent to a MRM' (LM26-P section 3.2) beside ring 0; position unpublished. The default site 'aggressor' is at (0, -30) um: 30 um from ring 0, and every ring-to-site distance is the same as at the former (0, 30) um, so the A1/A2 calibrations in ring units do not change. It is 55 um from ring 0's monitor PD (ring.thermal.pd_offset_um (0, 25) um). It moved from (0, 30) um, 5 um from that PD, because there the calibrated A1 power heats the PD past ~600 degC, which is not physical for a real layout. The former position stays as the site 'aggressor_pd_adjacent' for the stress scenarios a1_slide10_aggressor_pd_adjacent and a2_808_aggressor_pd_adjacent only (monitor dark-current runaway); with no scenario power it adds no heat. The new site is at the same point as ring 0's driver site (ring.thermal.driver_offset_um (0, -30) um): both are heat sources, so the model adds them, but a real layout cannot put both there"

array:
  n_rings: {value: 8, provenance: printed, generation: G26, source: LM26-P, note: "8 MRMs coupled to a single bus waveguide"}
  bus_order: {value: [0, 1, 2, 3, 4, 5, 6, 7], provenance: assumed, generation: none, source: MODEL}
  heater_total_power_max_w: {value: 0.2, provenance: assumed, generation: none, source: D07,
                             note: "die heater supply limit; 8 heaters at 25-34 mW each can exceed it (07 P1-12)"}
  heater_supply_current_max_a: {value: 0.15, provenance: assumed, generation: none, source: D07}

datapath:
  bitrate_gbps:
    value: 50.0
    provenance: printed
    generation: G26
    source: LM26-P
    alternatives:
      line_rate: {value: 53.125, provenance: printed, generation: G26, source: WPW, note: "53.125 Gbaud line rate of a nominal 50 Gb/s lane (01 D15)"}
  bitstat_window_bits: {value: 64, provenance: literature, generation: none, source: SUN15, note: "16-128 bits in Sun et al."}
  error_count_period_s: {value: 2.0, provenance: printed, generation: G26, source: LM26-P, note: "BER sampled every 2 s"}
  error_count_latency_s: {value: 1.0e-3, provenance: assumed, generation: none, source: MODEL}
  transition_density: {value: 0.5, provenance: inferred, generation: G26, source: LM26-P, note: "PRBS (random NRZ)"}

controller_interface:
  update_rate_hz: 100000.0             # PAT-2 calibration vectors every 10 us (fastest of 10 us / 100 us / 1 ms)
  bind:
    tx:
      heater: controller
      bias: scenario
      assignment: scenario
    laser:
      tune: scenario
  knowledge: [line_grid, ring_to_line]  # WDM acquisition: the spec gives the bus order and the nominal grid only
  schedule: simultaneous
  on_out_of_range: clip

scenario:
  ambient_c: 25.0
  bias_v: 1.05                          # best stabilized relOMA (-2.1 dB) sits near 1.05 V (LM26-S slide 9)
  time_compression: 1.0

metrics:
  reloma_definition: oma_over_pin
  ber_sample_period_s: 2.0
  lock_threshold_pm: 5.0                # the textbook's 5 pm lock budget
  hysteresis_pm: 1.0
  allowed_assignments: fixed

uncertainty:
  # ----- uncertainty: one draw per world, shared by every ring. Entries are applied in sorted name order, so an
  # entry later in the alphabet overrides a leaf an earlier one set (film_thickness < thermo_optic).
  thermo_optic:
    kind: hypothesis
    choices:
      H_solver: {}                                          # the solver s0 and beta of the drawn film thickness
      H86: {ring.thermal.dlambda_dt_pm_per_k: H86, ring.thermal.dlambda_dt_beta_per_k: const}
      H86_sensor: {ring.thermal.reference_rise_frac: sensor}  # plant = H_solver; Lightmatter's degC read 0.8 of the rise
      bench: {ring.thermal.dlambda_dt_pm_per_k: bench}
      imec: {ring.thermal.dlambda_dt_pm_per_k: imec}
      ocp: {ring.thermal.dlambda_dt_pm_per_k: ocp}
      textbook_derived: {ring.thermal.dlambda_dt_pm_per_k: textbook_derived}
    nominal: H_solver
    weights: {H_solver: 2, H86: 1, H86_sensor: 1, bench: 0, imec: 0, ocp: 0, textbook_derived: 0}
    provenance: assumed
    generation: none
    source: D07
    note: "07 D2: H_solver default, H86 required robustness corner, H86_sensor the most plausible reconciliation; the other values are plain alternatives (weight 0, select with --alt uncertainty.thermo_optic=<name>)"
  film_thickness:
    kind: hypothesis
    choices:
      "160": {}
      "200":
        ring.geometry.film_nm: rib200
        ring.geometry.slab_nm: rib200
        ring.geometry.width_nm: rib200
        ring.optics.n_eff: rib200
        ring.optics.n_g: rib200
        ring.optics.dn_g_dlambda_per_nm: rib200
        ring.thermal.dlambda_dt_pm_per_k: rib200
        ring.thermal.dlambda_dt_beta_per_k: rib200
        ring.optics.loss_budget.alpha_bend_radiation_db_per_cm: rib200_q_anchor
        ring.geometry.jacobian: rib200
    nominal: "160"
    weights: {"160": 3, "200": 1}
    provenance: assumed
    generation: none
    source: D07
    note: >-
      07 D21 waveguide_thickness_nm (renamed so it applies before thermo_optic): 160 nm GF 45SPCLO (printed, single
      source) or the 400 x 200 nm SMTAI render as a rib (modes_rib200: 80 nm slab, n_g 4.0116, s0 66.91 pm/K, bend
      radiation 1.03 dB/cm; a depletion modulator needs the slab to contact its junction, so the strip artefact
      strip400x200, the stand-in until 2026-10-16, stays a plain alternative only). The 200 nm world keeps the
      measured G25 Q_i (so the CAL-2 notch and the coupling regime) through the rib200_q_anchor loss term: with the
      budget fixed in dB/cm, the rib's n_g would raise Q_i 1.8 %. Its geometry Jacobian (0.368, 0.913, 0.787 nm/nm)
      with the same fabrication sigmas gives a 4.2 nm die resonance spread (6.2 nm on rib160): the sigmas are
      fabrication errors, and the thicker film is less sensitive. Couplers and the thermal ROM keep the 160 nm values
  thermal:
    family:
      kind: hypothesis
      choices:
        inring_noundercut: {ring.thermal.family: inring_noundercut}
        silicide_undercut:
          ring.thermal.family: silicide_undercut
          ring.thermal.tau_fast_s: undercut
          ring.thermal.share_fast_frac: undercut
          ring.thermal.tau_slow_s: undercut
          ring.thermal.heater_node_tau_s: undercut
          ring.heater.tcr_per_k: silicide
          ring.thermal.heater_self_ratio: silicide
        metal_above:
          ring.thermal.family: metal_above
          ring.thermal.heater_node_tau_s: metal
          ring.heater.tcr_per_k: tin
          ring.thermal.heater_self_ratio: tin
        textbook:
          ring.thermal.family: inring_noundercut
          ring.thermal.tau_fast_s: textbook
          ring.thermal.share_fast_frac: textbook
          ring.thermal.tau_slow_s: textbook
          ring.thermal.tail_share_frac: textbook
          ring.thermal.xt_nearest_frac: textbook
          ring.thermal.xt_next_frac: textbook
          ring.thermal.xt_floor_frac: textbook
          ring.thermal.site_floor_frac: textbook
          ring.thermal.xt_tau_ref_s: textbook
          ring.thermal.xt_dist_ref_um: textbook
          ring.thermal.xt_tau_min_s: textbook
          ring.heater.tcr_per_k: textbook
          ring.thermal.heater_self_ratio: textbook
      nominal: inring_noundercut
      weights: {inring_noundercut: 2, silicide_undercut: 1, metal_above: 1, textbook: 0}
      provenance: assumed
      generation: none
      source: D07
      note: "07 P1-3 heater family, with the TCR tied to it (07 4.8 heater.tcr): in-ring doped Si (default), GF-PDK silicide with undercut (GF-ECIO), metal above (imec). The interim poles of the in-ring family are imec's measured-calibrated set (07 P1-2). textbook (weight 0) is the 07 D22 pessimistic corner"
    stack:
      kind: hypothesis
      choices:
        side_by_side: {ring.thermal.stack: side_by_side}
        stacked_eic:
          ring.thermal.stack: stacked_eic
          ring.heater.p_fsr_mw: stacked_eic
          ring.thermal.xt_nearest_frac: stacked_eic
          ring.thermal.xt_next_frac: stacked_eic
          ring.thermal.xt_floor_frac: stacked_eic
          ring.thermal.site_floor_frac: stacked_eic
        side_by_side_tec_held:
          ring.thermal.stack: side_by_side
          ring.thermal.xt_nearest_frac: tec_held
          ring.thermal.xt_next_frac: tec_held
          ring.thermal.xt_floor_frac: tec_held
          ring.thermal.site_floor_frac: tec_held
          ring.thermal.xt_tau_ref_s: tec_held
          ring.thermal.xt_tau_min_s: tec_held
      nominal: side_by_side
      weights: {side_by_side: 3, stacked_eic: 1, side_by_side_tec_held: 0}
      provenance: assumed
      generation: none
      source: D07
      note: >-
        07 P1-3: G26 has the SerDes beside the PIC; an EIC stacked on the PIC (M1000-like) costs 20-42 % heater
        efficiency (measured) and +44 % crosstalk (simulated) (CO24-JOM, 04 V8). The stack's package also sets the
        ring-to-ring and long-range crosstalk (physics_thermal review 2026-10-16): side_by_side and stacked_eic use
        the imec numbers (04 X1, X2), measured with natural convection and an EIC on top (a large R_pkg): 3 % nearest,
        1.5 % to every other ring and every far site, first-order 1.5-9 ms poles (the d^2 law, then the X2 table).
        side_by_side_tec_held is the in-ring FEM ROM's case: side by side in a TEC-held package (R_pkg 2 K/W): 1.0 %
        nearest with a 0.12-0.13 ms pole at the pitch, 0.51 % next, 0.26 % floor, 0.09 % at 1 mm (die sensor), 13x
        faster at the pitch. The G26 package is not published. Weight 0 (a named corner, g26_tec_package, in the
        robustness set; appended last, so no sampled or Latin-hypercube draw changes): sampled worlds keep the imec
        numbers, so a controller claim over sampled worlds does not cover a TEC-held package; weighting it is the
        content owner's decision (VALIDATION.md closure-crosstalk-dynamics)
    scaling:
      kind: hypothesis
      choices:
        resistance: {ring.thermal.scaling_hypothesis: resistance}
        capacitance: {ring.thermal.scaling_hypothesis: capacitance}
      nominal: resistance
      weights: {resistance: 2, capacitance: 1}
      provenance: assumed
      generation: none
      source: D07
      note: "07 P1-2 scaling_hypothesis; 'independent' coincides numerically with 'capacitance' (plant_thermal handoff 6.2), so it is not sampled twice"
    time_scale_fast: {kind: interval, low: 0.5, high: 2.0, dist: loguniform, nominal: 1.0, provenance: assumed,
                      generation: none, source: R04, note: "07 4.8, D15: die-level, on top of the family"}
    time_scale_slow: {kind: interval, low: 0.5, high: 2.0, dist: loguniform, nominal: 1.0, provenance: assumed,
                      generation: none, source: R04}
    package_tail_tau_s: {kind: interval, low: 1.0e-3, high: 1.0e-2, dist: loguniform, nominal: 3.0e-3,
                         provenance: assumed, generation: none, source: R04, note: "07 4.8 thermal.package_tail (absolute tau)"}
    package_tail_share_frac: {kind: interval, low: 0.02, high: 0.10, nominal: 0.05, corners: {textbook: 0.0},
                              provenance: assumed, generation: none, source: R04}
    transport_delay_s: {kind: interval, low: 0.0, high: 2.0e-6, nominal: 0.0, provenance: assumed, generation: none,
                        source: D07, note: "07 4.8 [VAL]; applied by the heater FIFO (plant_thermal 6.7)"}
    crosstalk_scale: {kind: interval, low: 0.33, high: 1.73, dist: loguniform, nominal: 1.0,
                      corners: {nearest_10pct: 3.33}, provenance: literature, generation: none, source: CO24-JOM,
                      note: "scales every ring-to-ring residue: nearest 1-5.2 %, floor 0.5-2.6 % (07 4.8; the floor range fully, nearest up to 10 % in the corner)"}
  self_heating:
    eta:
      kind: hypothesis
      choices:
        nominal: {}
        low: {ring.optics.loss_budget.alpha_fca_db_per_cm: eta_0p5, ring.optics.loss_budget.alpha_scatter_db_per_cm: eta_0p5}
        mid_low: {ring.optics.loss_budget.alpha_fca_db_per_cm: eta_0p65, ring.optics.loss_budget.alpha_scatter_db_per_cm: eta_0p65}
        mid: {ring.optics.loss_budget.alpha_fca_db_per_cm: eta_0p75, ring.optics.loss_budget.alpha_scatter_db_per_cm: eta_0p75}
        high: {ring.optics.loss_budget.alpha_fca_db_per_cm: eta_0p95, ring.optics.loss_budget.alpha_scatter_db_per_cm: eta_0p95}
        stress_0p3: {ring.optics.loss_budget.alpha_fca_db_per_cm: eta_0p3, ring.optics.loss_budget.alpha_scatter_db_per_cm: eta_0p3}
      nominal: nominal
      weights: {low: 1, mid_low: 6, mid: 9, nominal: 10, high: 2, stress_0p3: 0}
      provenance: assumed
      generation: none
      source: D07
      note: >-
        07 D1/4.8 self_heating.eta 0.5-0.95 (nominal ~0.85) via the loss budget, discretized to 0.5 / 0.65 / 0.75 /
        0.848 / 0.95 at a fixed alpha_i (a continuous draw would move Q_i and the coupling regime: the machinery has no
        tied draw, see handoff). The weights are the masses of a triangular density on [0.5, 0.95] with its mode at the
        nominal, binned at the midpoints between the points (1 : 6 : 9 : 10 : 2). stress_0p3 (weight 0) is the 07 D1
        stress corner. Values are for the under-coupled 160 nm world; the over-coupled choice lowers alpha_other, so
        each point sits ~0.01-0.04 lower there, and the 200 nm world scales them by 0.98 (rib200_q_anchor)
    z_ratio: {kind: interval, target: ring.thermal.z_ratio_opt_heater, low: 1.0, high: 2.0, provenance: assumed,
              generation: none, source: D07, note: "07 4.8 [PHY], 06 H2"}
  chip_input_loss:
    kind: interval
    target: optical_path.chip_input_loss_db
    low: 2.0
    high: 10.0
    corners: {ring_plus8dbm: 2.0, ring_0dbm: 10.0, ocp_ring_plus9dbm: 1.0}
    provenance: inferred
    generation: G25
    source: LM-P
    note: "07 4.8 power_at_ring_dbm 0 to +8 dBm (nominal +4) with 10 dBm per line at the laser: a loss of 10 to 2 dB (low loss = high power)"
  q_loaded:
    kind: interval
    target: ring.optics.q_loaded
    low: 3500
    high: 4200
    corners: {low_q: 2600}
    provenance: read-off
    generation: G25
    source: LM-T
    note: >-
      CAL-1 (07 4.3, 4.8). KNOWN LIMITATION: Q_L is drawn alone while Q_i stays at the loss budget (the machinery has no
      tied draw, see handoff), so the G25 0 V notch is 27.9 dB only at 3850. The coupling regime is then exact only
      near the nominal: the exact ring at 1301.9 nm is critically coupled at Q_L = (1 - 2 kappa_d/kappa) Q_i/2 = 3699
      (under choice) and 4014 (over choice), so an 'under' world is in fact over-coupled for Q_L < 3699 (28 % of the
      interval) and an 'over' world under-coupled above 4014 (27 %). At the ends: under 25.5 dB (over-coupled) at 3500
      and 17.5 dB at 4200; over 18.0 dB at 3500 and 26.8 dB (under-coupled) at 4200. Pin q_loaded at nominal (as
      g26_overcoupled does) when the regime must hold
  coupling_regime:
    kind: hypothesis
    choices:
      under: {}
      over: {ring.optics.loss_budget.alpha_other_abs_db_per_cm: over}
    nominal: under
    provenance: assumed
    generation: none
    source: D07
    note: "07 P1-5 under | over coupled at the same 27.9 dB G25 notch (exact ring, 1301.9 nm, Q_L 3850; the 200 nm world within 0.2 dB); the fit of CAL-1/CAL-2 returns both branches. The label holds only for Q_L near its nominal (see uncertainty.q_loaded)"
  er_mechanism:
    kind: hypothesis
    choices:
      dispersion: {}
      ring_t_loss: {ring.optics.dln_alpha_dt_ring_per_k: ring_t_loss}
      heater_t_loss: {ring.optics.dln_alpha_dt_heater_per_k: heater_t_loss}
    nominal: dispersion
    provenance: assumed
    generation: none
    source: D07
    note: "07 P1-5: what makes the G25 notch fall with heater drive; only heater_t_loss drifts under lock"
  fsr:
    kind: hypothesis
    target: ring.optics.fsr_thz
    choices: [default, window_a, g25_cluster, pdk_size, window_b_low, window_b_high]
    nominal: default
    weights: {default: 2, window_a: 1, g25_cluster: 0, pdk_size: 0, window_b_low: 0, window_b_high: 0}
    provenance: assumed
    generation: none
    source: D07
    note: "07 P1-6 / D17: window B (1.8 THz design) default, window A (restricted to 1.46-1.48 THz by the BND-1 review); G25 cluster 1.53 and PDK size 1.60 THz are stress hypotheses (weight 0)"
  heater:
    driver_mode:
      kind: hypothesis
      choices:
        voltage: {ring.heater.driver_mode: voltage}
        current: {ring.heater.driver_mode: current}
        power: {ring.heater.driver_mode: power}
        dac_pwm: {ring.heater.driver_mode: dac_pwm}
      nominal: voltage
      provenance: assumed
      generation: none
      source: D07
      note: "07 P1-11; dac_pwm is the PAT-2 8-bit DAC + 8-bit PWM"
  driver:
    levels:
      kind: hypothesis
      choices:
        centered: {driver.level_convention: centered}
        one_sided: {driver.level_convention: one_sided}
      nominal: centered
      provenance: assumed
      generation: none
      source: MODEL
      note: "which terminal the G26 bias axis drives is unpublished (plant_electrical note 4); not in 07 4.8"
  monitor:
    gain_scale: {kind: interval, target: ring.monitor.gain_scale, low: 0.5, high: 2.0, dist: loguniform,
                 provenance: assumed, generation: none, source: D07, note: "07 D7, P1-9"}
    dark_i0: {kind: interval, target: ring.monitor.dark_i0_na, low: 1.0, high: 30.0, dist: loguniform,
              provenance: assumed, generation: GF, source: GF-BIAN, note: "07 D20: 1-30 nA at 25 degC"}
  timing:
    latency_scale: {kind: interval, low: 0.5, high: 2.0, dist: loguniform, nominal: 1.0, provenance: assumed,
                    generation: none, source: D07, note: "07 4.8 loop latency 0.5-2x the declared total"}
  aggressor:
    referencing:
      kind: hypothesis
      choices: {resonance: {}, temperature: {}}
      nominal: resonance
      provenance: assumed
      generation: none
      source: D07
      note: "07 D6: a world variable for the scenario (PlantParams.world): aggressor targets in resonance units (default) or degC"
    waveform:
      kind: hypothesis
      choices: {rectified_sine: {}, symmetric_triangle: {}}
      nominal: rectified_sine
      provenance: read-off
      generation: G26
      source: LM26-S
      note: "07 4.8 lists 'slide-10 parabolic'; the re-digitized slide-10 trace is a rectified sine (01 D7 correction, CAL-13a)"

variation:
  # ----- variation: per device, separate stream from the worlds
  geometry:
    width: {die_sigma_nm: 5.0, ring_sigma_nm: 2.0}
    thickness: {die_sigma_nm: 4.2, ring_sigma_nm: 1.3}
    gap_through: {ring_sigma_nm: 1.5}
    gap_drop: {ring_sigma_nm: 1.5}
    width_closes_gaps: true
    jacobians: [ring.geometry.jacobian, ring.geometry.jacobian_coupling]
    provenance: assumed
    generation: none
    source: BER-FAB
    note: >-
      Width and film: split chosen (with the strip Jacobian 0.65 / 1.19 nm/nm) to reproduce the Berkeley 6 nm die
      and 2 nm local resonance spreads (textbook fabOffset*); through the loaded rib160 Jacobian (0.402 / 1.390 nm/nm)
      they give 6.17 nm and 1.98 nm (independent draws add in quadrature); CAL-9 (G26 lane offsets 7.5-9.5 k codes)
      calibrates them later. Gaps: one local sigma for both couplers, 1.5 nm (assumed: the edges' own placement
      error; a width error also closes both gaps, width_closes_gaps, so the die-level gap bias is the width's). With
      coupling_rib160 (d ln K^2/d gap -1.35 / -1.41 %/nm) the gaps alone spread K_t^2 and K_d^2 by 2.0 % and 2.1 %
      per ring; with the width and film terms the per-pass couplings move 3.5 % (through) and 5.3 % (drop) within a
      die and 9.3 % and 16 % from die to die (correlated with the resonance offset, 07 P1-16). 07 P1-9's '+-5 nm of
      gap is +-10 % of gain' used femwell's strip slope (-2 %/nm); +-5 nm is 3.3 sigma here. These replace the
      former stand-in draws of q_loaded (rel 0.015, 1.5 nm) and kappa_d_over_kappa (rel 0.1, 5 nm)
  ring.heater.p_fsr_mw: {level: ring, dist: lognormal, die_sigma: 0.05, ring_sigma: 0.02, truncate: false,
                         provenance: inferred, generation: G25, source: LM-T,
                         note: "G25 60-die maps: median 25.45, range 24.9-34.1 mW, strongly right-skewed (-2 % / +34 % of the median). The machinery has only symmetric (log-)normal and uniform draws, so this is a compromise: a 60-die sample of it spans ~22.7-28.9 mW, i.e. ~1/3 of the rings fall below the observed minimum and the +34 % tail is missing (the stacked_eic alternative 36.9 mW is the high-P_FSR corner). Not truncated (clipping at 24.9 would pile 1/3 of the rings on it). Ring-to-ring within a die assumed"}
  ring.heater.r_cold_ohm: {level: ring, dist: lognormal, die_sigma: 0.06, ring_sigma: 0.01, truncate: false,
                           provenance: inferred, generation: G25, source: LM-T,
                           note: "G25 60-die hot resistance 52.8-70.5 ohm around 55.9 (-6 % / +26 %, right-skewed like P_FSR); the symmetric lognormal is a compromise (its lower tail goes below the observed minimum, the upper tail is short). Not truncated"}
  ring.monitor.responsivity_a_per_w: {level: ring, rel_sigma: 0.03, provenance: printed, generation: G25, source: LM-T,
                                      note: "0.88-1.04 A/W over 500 parts (CAL-11), truncated to that range"}
  laser.line_offset_ghz: {level: line, die_sigma: 4.0, line_sigma: 6.0, provenance: inferred, generation: Guide,
                          source: YOLE, note: "+-15 GHz demonstrated (~2 sigma of the total) with a common-mode part per laser module (04 section 3.2); clipped to the +-20 GHz requirement"}
  ring.monitor.adc_offset_codes: {level: ring, ring_sigma: 5.0, provenance: assumed, generation: none, source: MODEL}
  ring.monitor.adc_gain_error_frac: {level: ring, ring_sigma: 0.01, provenance: assumed, generation: none, source: MODEL}
