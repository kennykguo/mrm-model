# strong self-heating corner — eta 0.95, Z_opt/Z_heater 2, and +8 dBm
# at the first ring after 2 dB chip-input loss from the 10 dBm laser.
# pin under-coupling and the 160 nm film so these eta alternatives are exact.
# the over-coupled branch reduces heating loss and the 200 nm film adds
# non-heating loss. their eta would instead be 0.946 and 0.876.
extends: g26
meta:
  name: g26_hot_selfheat
  kind: corner
  description: "g26 with eta high (0.95), z_ratio high (2.0) and +8 dBm at the ring (under-coupled, 160 nm film)"
alts:
  uncertainty.self_heating.eta: high
  uncertainty.self_heating.z_ratio: high
  uncertainty.chip_input_loss: ring_plus8dbm
  uncertainty.coupling_regime: under
  uncertainty.film_thickness: "160"
