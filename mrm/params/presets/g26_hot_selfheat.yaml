# Corner (07 P0-1, 4.8): the strongest self-heating inside the uncertainty set: eta 0.95, Z_opt/Z_heater 2, and
# +8 dBm at the first ring (chip input loss 2 dB with the 10 dBm G26 laser). The coupling regime and the film are
# pinned to under / 160 nm because the eta alternatives are exact only there (the over-coupled branch lowers the
# heating loss, the 200 nm world adds non-heating loss: eta would fall to 0.946 / 0.876), and the under-coupled
# 160 nm ring absorbs the most.
extends: g26
meta:
  name: g26_hot_selfheat
  kind: corner
  description: "g26 with eta high (0.95), z_ratio high (2.0) and +8 dBm at the ring (under-coupled, 160 nm film)"
alts:
  uncertainty.self_heating.eta: high
  uncertainty.self_heating.z_ratio: high
  uncertainty.chip_input_loss: ring_plus8dbm
  uncertainty.coupling_regime: under
  uncertainty.film_thickness: "160"
