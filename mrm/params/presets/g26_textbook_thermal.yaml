# textbook thermal corner — self heat uses 10 us at 75 percent and
# 300 us at 25 percent, with no package tail. crosstalk is 10/3/0 percent
# and TCR is 1e-3 /K. a 25 us crosstalk pole approximates the textbook's
# self-path shape within 0.16 of DC. the corner cannot select the global
# crosstalk_dynamics setting.
# pin time scales, stack, scaling, optical power, and absorption strength.
# this keeps the sampled self-heating lag bound below 0.05 at 1 us steps
# (the observed maximum was 0.044). combining fast crosstalk with +8 dBm,
# eta 0.95, and z ratio 2 can raise that lag to about 0.11.
# use --set sim.dt_plant_s=2.5e-7 to study that stronger combination.
extends: g26
meta:
  name: g26_textbook_thermal
  kind: corner
  description: "g26 with the textbook thermal network (uncertainty.thermal.family pinned to textbook)"
alts:
  uncertainty.thermal.family: textbook
  uncertainty.thermal.stack: side_by_side
  uncertainty.thermal.scaling: resistance
  uncertainty.thermal.package_tail_share_frac: textbook
  uncertainty.thermal.time_scale_fast: nominal
  uncertainty.thermal.time_scale_slow: nominal
  uncertainty.thermal.crosstalk_scale: nominal
  uncertainty.chip_input_loss: nominal
  uncertainty.self_heating.eta: nominal
  uncertainty.self_heating.z_ratio: nominal
