    conditions_note: >-
      relOMA reference: "1 mW of laser into the MRM" (HC slide 16 note, printed; 07 D9). The junction swing and the
      actual line power are unpublished (07 Q4). The second reading, "OMA in dBm at the actual input power", is kept
      only as a question.
    generation: G26
    source: [LM26-S, HC]
    locator: OFC 2026 deck slide 9 (loop-closed relOMA map, contour labels); HC slide 16 (same map and the 1 mW note)
    provenance: printed
    rechecked: false
    verification: >-
      Contour level printed; its bias position is read-off (about 1.0-1.15 V, 01 section 2.7). The 01 verifier did not
      re-check the slide-9 read-offs (01 verification log, "Not re-checked"). Context (06 M6, V6): at Q 3500 the
