    replica: relOMA_map
    replica_args: {mode: oracle, bias_v: [1.0, 1.15], t_c: [0.0, 105.0], alternative_mode: setpoint_lock}
    tolerance: {kind: abs, value: 0.3}
    tolerance_basis: Same band as the held-out relOMA targets (07 4.4).
    fit: true
    identifies: >-
      One lumped modulation depth (swing x efficiency / FWHM), 07 D9. The oracle mode gives the best achievable
      relOMA, so a depth fitted in oracle mode is a lower bound if G26 locks off-optimum; the result records the mode.
