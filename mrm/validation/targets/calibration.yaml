    provenance: read-off
    readoff: {by: "the textbook (Ch16 accuracy table)", image: "Yole OFC 2026 briefing, Guide VLSP accuracy slide", method: "not recorded", crop: "not recorded"}
    rechecked: false
    verification: >-
      The +-15 GHz claim is printed (01 verification log item 27, without the word "demonstrated"). The quartiles are
      the textbook's read-off of the same slide (median -2 GHz, interquartile -5.5 to +1.5 GHz, whiskers +11.5 and
      -15 GHz, outliers to -21 GHz) and were not re-checked by 01. [corrected at the review of 2026-10-09] This entry
      first bounded the sampled standard deviation by 15 GHz, which reads a yield limit as a sigma and accepts a
      spread about 3 times wider than the plotted population (interquartile 7 GHz, sigma about 5 GHz if normal).
