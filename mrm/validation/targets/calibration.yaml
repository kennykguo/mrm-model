  - id: CAL-13a
    quantity: aggressor_trajectory_slide10
    description: >-
      Temperature trajectory of the G26 slide-10 on-chip aggressor, fitted as a rectified sine
      T(t) = T_max - dT * |sin(pi * (t - t0) / P)| (cusp at T_max, rounded minimum).
    kind: parametric
    value:
      form: rectified_sine
      params: {t_max_c: 113.6, delta_t_k: 88.5, period_s: 0.1307}
      fit_rms_c: 0.34
      derived: {t_min_c: 25.1, peak_rate_k_per_s: 2127.0, mean_rate_k_per_s: 1354.0}
    unit: c
    sigma: {t_max_c: 1.0, delta_t_k: 1.0, period_s: 0.001}
    conditions:
      t_c: [25.0, 113.6]
      t_reference: unknown
      heater_code: closed_loop
      bias_v: null
      p_in_dbm: null
      port: drop
      loop: closed
    conditions_note: >-
      Which thermometer the plotted degC comes from is not published (07 Q5). Default referencing is `resonance`:
      the target is the resonance trajectory 85.86 pm/K x T(t) (07 D6, P1-4); `temperature` is the alternative.
    generation: G26
    source: LM26-S
    locator: OFC 2026 deck slide 10 ("On Chip Thermal Aggressor"), temperature panel
    provenance: read-off
    readoff: {by: "docs/research/01_lightmatter_public.md verification log items 4 and 5", image: "LM26-S slide 10", method: "re-digitized T trace and red dT/dt trace; least-squares fit of the rectified sine", crop: "the temperature panel of slide 10, four periods (peaks at 65.1 to 456.6 ms; exact pixel crop not recorded)"}
    rechecked: true
    verification: >-
      [corrected after 07 was written] 07 P1-4 describes a parabolic segment with a +-2200 degC/s linear sawtooth
      rate. 01 D7 and verification log item 5 correct this: a linear 0 -> 2200 degC/s ramp over 65 ms gives only 72 K, not
      the plotted 88 K; the rectified sine fits to 0.34 degC rms (parabola 1.6 degC rms, implying a 2780 degC/s peak).
      Re-derived here: peak |dT/dt| = pi*dT/P = 2127 degC/s, mean = 2*dT/P = 1354 degC/s, T_min = 25.1 degC. Raw
      read-off: T 24.6 -> 112.6 degC, peaks every 130.2-131.1 ms (mean spacing 130.5 ms), red trace -2130 ... +2170
      degC/s.
    replica: aggressor_trajectory
    replica_args: {referencing: resonance, dlambda_dt_pm_per_k: 85.86, waveform: rectified_sine, t0: cusp_at_t_zero, window: one_period_in_periodic_steady_state}
    tolerance: {kind: rms_abs, value: 1.0}
    tolerance_basis: >-
      RMS of (model ring temperature equivalent - T(t)) over one period in periodic steady state (not the start-up
      transient), in K, with t_s = 0 at a cusp (T = T_max); the temperature equivalent is the model resonance shift /
      85.86 pm/K under `resonance` referencing. 1.0 K is about 3x the fit rms.
    fit: true
    identifies: >-
      The aggressor power waveform through the thermal ROM (a scenario calibration, not a plant one). The result is
      tagged `calibrated` and records the assumed thermal poles (07 P1-4).
    data_points: [g26_slide10_temperature/trajectory, g26_slide10_temperature/rate_trace]
    status: active

  - id: CAL-13b
    quantity: aggressor_rate_808
    description: >-
      The peer-reviewed on-chip aggressor: "808 degC/s within the MRM", ramped up and down between 25 degC and
      >105 degC with a period of 100 ms, one MRM, local resistive heater adjacent to it.
    kind: scalar
    value: 808.0
    unit: k_per_s
    sigma: null
    conditions:
      t_c: [25.0, 105.0]
      t_reference: unknown
      heater_code: closed_loop
      bias_v: null
      p_in_dbm: null
      port: drop
      loop: closed
      period_s: 0.1
    conditions_note: >-
      The caption says "between 25 degC and 105 degC"; the text says ">105 degC". The Fig. 3(b) inset is
      under-sampled (excluded.yaml EXC-3), so the waveform shape is not known.
    generation: G26
    source: LM26-P
    locator: OFC 2026 M4B.3 section 3.2 and Fig. 3 caption
    provenance: printed
    rechecked: true
    verification: >-
      01 verification log items 2 and 3; 06 V17. 808 x 0.1 s = 80.8 K, so 808 is most likely dT per period; with both ramps
      in one period the mean edge rate is at least 1600 degC/s. If the slide-10 shape applies with dT = 80 K and
      P = 100 ms, the mean is 1600 and the peak about 2510 degC/s (01 D7, derived). If the waveform were a one-sided
      sawtooth, 808 would be the true ramp slope (hedge in 01 D7). It may be the same heater as CAL-13a (07 P1-4 A2).
    replica: aggressor_trajectory
    replica_args: {referencing: resonance, dlambda_dt_pm_per_k: 85.86, interpretation: [delta_t_per_period, one_sided_sawtooth], waveform: [rectified_sine, symmetric_triangle]}
    tolerance: {kind: abs, value: 80.0}
    tolerance_basis: 10 % of the printed rate, under the chosen interpretation (the result records which).
    fit: true
    identifies: The amplitude of aggressor scenario A2, conditional on the interpretation hypothesis (uncertainty aggressor.waveform).
    data_points: [g26_paper/aggressor_808]
    status: active

  - id: CAL-14
    quantity: reloma_stabilized_low_bias_db
    description: Stabilized relOMA at the low-bias end of the G26 map (about 1.0 to 1.15 V), relOMA = OMA / 1 mW of laser into the MRM.
    kind: scalar
