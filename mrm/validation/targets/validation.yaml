    replica: stabilizer_code_vs_T
    replica_args: {t_c: [0.0, 105.0]}
    tolerance: {kind: pending}
    tolerance_basis: Not settable before Q3 is answered.
    tests: dlambda/dT x heater efficiency in controller units, once the code-to-power law is known.
    data_points: [g26_slide10_dac/swing_top_lane, g26_slide10_dac/swing_bottom_lane]
    blocked_by: [CAL-9a, CAL-9b, CAL-9c]
    status: deferred

  - id: VAL-7a
    quantity: group_index_published_geometry
    description: Group index of the de Cea et al. 2019 45 nm MRM (1545 nm), as reported by the [VAL] reviewer.
    kind: scalar
    value: 2.73
    unit: "1"
    sigma: null
    conditions: {t_c: null, t_reference: unknown, heater_v: null, bias_v: null, p_in_dbm: null, port: none, loop: none, lambda_nm: 1545.2}
    generation: none
    source: DEC19
    locator: de Cea, Atabaki, Ram, Opt. Express 27, 24274 (2019), Table 1 (as reported by [VAL] in 07 4.4)
    provenance: literature
    rechecked: false
    verification: >-
      UNVERIFIED. No research report confirms n_g = 2.73 (03 read the paper and its Table 1 but quotes only gamma_0,
      gamma_lin, gamma_rad, gamma_th, tau and Gamma). The full text could not be fetched during this split (Optica
      returns a JavaScript wall). A wrong value here would make a correct pipeline fail, so it is reported but not
      scored until someone re-reads Table 1 and re-freezes.
    replica: mode_solve_published_geometry
    replica_args: {paper: DEC19, output: n_g}
    tolerance: {kind: rel, value: 0.03}
    tolerance_basis: 07 4.4 (+-3 % n_g).
    tests: modes.py on a geometry that is actually published (third-party pipeline replication).
    inputs_needed: The cross-section of the de Cea device (not yet extracted into docs/research).
    data_points: [dec19/n_g]
    status: unverified

  - id: VAL-7b
    quantity: confinement_factor_published_geometry
    description: Confinement factor of the de Cea et al. 2019 MRM.
    kind: scalar
    value: 0.65
    unit: "1"
    sigma: null
    conditions: {t_c: null, t_reference: unknown, heater_v: null, bias_v: null, p_in_dbm: null, port: none, loop: none, lambda_nm: 1545.2}
    generation: none
    source: DEC19
    locator: de Cea et al. 2019 (as quoted in 03 section 7.1, verifier's note)
    provenance: literature
    rechecked: true
    verification: >-
      03 section 7.1 [corrected] note, written by a verifier who read the paper in full: "confinement factor (0.65 in
      de Cea ...)", a Poynting-normalized (Johnson-style) overlap. The replica must compute the same definition (an
      energy or power fraction in Si), not the index weight dn_eff/dn_Si (06 section 2.4).
    replica: mode_solve_published_geometry
    replica_args: {paper: DEC19, output: confinement_poynting_si}
    tolerance: {kind: abs, value: 0.05}
    tolerance_basis: 07 4.4 (+-0.05 Gamma).
    tests: modes.py on a published geometry.
    inputs_needed: The cross-section of the de Cea device (not yet extracted into docs/research).
    data_points: [dec19/confinement]
    status: active

  - id: VAL-7c
    quantity: self_heating_time_constant_published
    description: Ring self-heating (waveguide-core) thermal time constant of the de Cea et al. 2019 MRM.
    kind: scalar
    value: 0.45
    unit: us
    sigma: 0.05
    components: {from_gamma_th_2p4mhz_as_rate: 0.417, text: 0.5}
    conditions: {t_c: null, t_reference: unknown, heater_v: null, bias_v: null, p_in_dbm: null, port: none, loop: none, lambda_nm: 1545.2}
    generation: none
    source: DEC19
    locator: de Cea et al. 2019 Table 1 (gamma_th = 2.4 MHz) and text (tau_th about 0.5 us)
    provenance: literature
    rechecked: true
    verification: >-
      03 section 6.3 and verification log item 7: Table 1 prints gamma_th = 2.4 MHz and the text prints tau_th about
      0.5 us. 07 asked whether 2.4 MHz is angular: 1 / 2.4e6 s = 0.417 us agrees with the printed 0.5 us, while
      1 / (2 pi x 2.4e6) = 66 ns does not, so gamma_th is a rate in 1/s (1/tau), not cycles per second (derived).
    replica: self_heating_time_constant
    replica_args: {paper: DEC19, source_site: waveguide_absorption, observer: ring_mode_weighted}
    tolerance: {kind: rel, value: 0.5}
    tolerance_basis: 07 4.4 (+-50 % on tau).
    tests: thermal_fem.py with the absorption source in the waveguide core (07 P0-1) on a published device.
    inputs_needed: The de Cea device stack (radius 10 um, 45 nm zero-change process); not yet extracted into docs/research.
    data_points: [dec19/tau_th]
    status: active

