[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ringlab"
version = "0.1.0"
description = "An independently developed electrothermal microring control laboratory"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "pyyaml>=6,<7", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ringlab = "ringlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ringlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: numerical convergence or long simulation"]

