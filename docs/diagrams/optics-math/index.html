<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ring optics - equations</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #1e1e1e; background: #fff; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    a { color: inherit; text-underline-offset: 4px; }
    button { font: inherit; background: white; color: inherit; border: 1px solid #ddd; padding: 9px 14px; cursor: pointer; }
    button:hover, a:focus-visible { background: #f5f5f5; }
    button:disabled { opacity: .35; cursor: default; }
    :focus-visible { outline: 2px solid #1e1e1e; outline-offset: 4px; }
    aside { position: fixed; inset: 0 auto 0 0; width: 300px; padding: 30px 20px; overflow-y: auto; border-right: 1px solid #e5e5e5; }
    aside h1 { font: inherit; font-weight: 600; margin: 0 12px 10px; }
    aside p { margin: 0 12px 24px; color: #666; }
    nav a { display: block; text-decoration: none; padding: 12px; margin: 3px 0; }
    nav a[aria-current="page"] { background: #f3f3f3; }
    main { margin-left: 300px; padding: 30px 32px 60px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 26px; }
    #count { color: #666; margin-right: auto; }
    .links { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 24px; }
    .stage { overflow: auto; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 20px 0; }
    .stage img { width: 100%; display: block; height: auto; }
    .stage.enlarged img { width: 2000px; max-width: none; }
    #note { color: #666; max-width: 85ch; margin-top: 24px; }
    #code { overflow-wrap: anywhere; }
    @media (max-width: 950px) {
      aside { position: relative; width: auto; height: 250px; border-right: 0; border-bottom: 1px solid #ddd; }
      main { margin-left: 0; padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>ring optics - equations</h1>
    <p>equations and symbols<br>rendered LaTeX</p>
    <nav id="topics" aria-label="drawings"></nav>
  </aside>
  <main>
    <header>
      <span id="count" aria-live="polite"></span>
      <button id="previous" type="button">previous</button>
      <button id="next" type="button">next</button>
      <button id="zoom" type="button" aria-pressed="false">enlarge diagram</button>
    </header>
    <div class="links">
      <a id="drawing" download>vector equation sheet</a>
      <a id="svg" target="_blank" rel="noopener">full-size SVG</a>
      <a href="equations.excalidraw" download>equation atlas</a>
      <a href="equations.tex">LaTeX source</a>
    </div>
    <div class="stage" id="stage"><img id="preview" alt=""></div>
    
    <p id="code" hidden></p>
  </main>
  <script src="manifest.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
